<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details | Genius Academy</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<script src="js/app.js"></script>


<script>

/* ==========================================
   PAGE LAYOUT
========================================== */

renderLayout(
    "students",
    "Student Details"
);


/* ==========================================
   GET STUDENT ID
========================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const studentId =
    urlParams.get("id");


/* ==========================================
   LOAD STUDENT DETAILS
========================================== */

async function loadStudentDetails() {

    if (!studentId) {

        showError(
            "Student ID not found."
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/students/" +
                studentId
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load student"
            );

        }


        const student =
            await response.json();


        console.log(
            "Student from MySQL:",
            student
        );


        if (!student.id) {

            showError(
                "Student not found."
            );

            return;
        }


        /* ==================================
           STUDENT INFORMATION
        ================================== */

        document.getElementById(
            "pageContent"
        ).innerHTML = `


            <div class="row g-3">


                <!-- =================================
                     STUDENT INFORMATION
                ================================= -->

                <div class="col-lg-4">


                    <div class="panel">


                        <div class="panel-header">


                            <strong>

                                <i class="bi bi-person-circle"></i>

                                Student Information

                            </strong>


                        </div>


                        <div class="panel-body">


                            <h4 class="mb-3">

                                ${student.name || "Student"}

                            </h4>


                            <p>

                                <strong>
                                    Class:
                                </strong>

                                ${student.className || "-"}

                            </p>


                            <p>

                                <strong>
                                    Phone:
                                </strong>

                                ${student.phone || "-"}

                            </p>


                            <p>

                                <strong>
                                    Parent:
                                </strong>

                                ${student.parentName || "-"}

                            </p>


                            <p>

                                <strong>
                                    Join Date:
                                </strong>

                                ${student.joinDate || "-"}

                            </p>


                            <div class="mt-3">


                                <!-- EDIT -->

                                <a
                                    class="btn btn-sm btn-outline-secondary"
                                    href="student-form.html?id=${student.id}"
                                >

                                    <i class="bi bi-pencil"></i>

                                    Edit

                                </a>


                                <!-- BACK -->

                                <a
                                    class="btn btn-sm btn-outline-dark"
                                    href="students.html"
                                >

                                    <i class="bi bi-arrow-left"></i>

                                    Back

                                </a>


                            </div>


                        </div>


                    </div>


                </div>



                <!-- =================================
                     RIGHT SIDE
                ================================= -->

                <div class="col-lg-8">


                    <!-- =================================
                         FEES
                    ================================= -->

                    <div class="panel mb-3">


                        <div class="panel-header">


                            <strong>

                                <i class="bi bi-cash-stack"></i>

                                Fee Records

                            </strong>


                        </div>


                        <div class="panel-body">


                            <div class="table-responsive">


                                <table class="table table-hover">


                                    <thead>

                                        <tr>

                                            <th>
                                                Date
                                            </th>

                                            <th>
                                                Amount
                                            </th>

                                            <th>
                                                Status
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody id="feesTable">


                                        <tr>

                                            <td
                                                colspan="3"
                                                class="text-center text-muted"
                                            >

                                                Loading fees...

                                            </td>

                                        </tr>


                                    </tbody>


                                </table>


                            </div>


                        </div>


                    </div>



                    <!-- =================================
                         PERFORMANCE
                    ================================= -->

                    <div class="panel mb-3">


                        <div class="panel-header">


                            <strong>

                                <i class="bi bi-bar-chart"></i>

                                Performance

                            </strong>


                        </div>


                        <div class="panel-body">


                            <div class="table-responsive">


                                <table class="table table-hover">


                                    <thead>

                                        <tr>

                                            <th>
                                                Exam
                                            </th>

                                            <th>
                                                Subject
                                            </th>

                                            <th>
                                                Marks
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody
                                        id="performanceTable"
                                    >


                                        <tr>

                                            <td
                                                colspan="3"
                                                class="text-center text-muted"
                                            >

                                                Loading performance...

                                            </td>

                                        </tr>


                                    </tbody>


                                </table>


                            </div>


                        </div>


                    </div>



                    <!-- =================================
                         ATTENDANCE
                    ================================= -->

                    <div class="panel">


                        <div class="panel-header">


                            <strong>

                                <i class="bi bi-calendar-check"></i>

                                Attendance Records

                            </strong>


                        </div>


                        <div class="panel-body">


                            <div class="table-responsive">


                                <table class="table table-hover">


                                    <thead>

                                        <tr>

                                            <th>
                                                Date
                                            </th>

                                            <th>
                                                Status
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody
                                        id="attendanceTable"
                                    >


                                        <tr>

                                            <td
                                                colspan="2"
                                                class="text-center text-muted"
                                            >

                                                Loading attendance...

                                            </td>

                                        </tr>


                                    </tbody>


                                </table>


                            </div>


                        </div>


                    </div>


                </div>


            </div>

        `;


        /* ==================================
           LOAD FEES
        ================================== */

        loadFees();


        /* ==================================
           LOAD PERFORMANCE
        ================================== */

        loadPerformance();


        /* ==================================
           LOAD ATTENDANCE
        ================================== */

        loadAttendance();


    }


    catch (error) {

        console.error(
            "Student Details Error:",
            error
        );


        showError(
            "Unable to load student. Please check Spring Boot."
        );

    }

}


/* ==========================================
   LOAD FEES
========================================== */

async function loadFees() {

    try {


        const response =
            await fetch(
                "/api/students/" +
                studentId +
                "/fees"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load fees"
            );

        }


        const fees =
            await response.json();


        console.log(
            "Fees from MySQL:",
            fees
        );


        const table =
            document.getElementById(
                "feesTable"
            );


        if (!fees.length) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="text-center text-muted"
                    >

                        No fee records found.

                    </td>

                </tr>

            `;

            return;
        }


        table.innerHTML =

            fees.map(
                fee => `

                <tr>


                    <td>

                        ${fee.paymentDate || "-"}

                    </td>


                    <td>

                        <strong>

                            ₹${Number(
                                fee.amount || 0
                            ).toFixed(2)}

                        </strong>

                    </td>


                    <td>


                        <span class="badge ${
                            fee.status === "Paid"

                                ? "bg-success"

                                : "bg-warning text-dark"
                        }">

                            ${fee.status || "-"}

                        </span>


                    </td>


                </tr>

            `
            ).join("");


    }


    catch (error) {

        console.error(
            "Fees Error:",
            error
        );


        document.getElementById(
            "feesTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="3"
                    class="text-center text-danger"
                >

                    Unable to load fees.

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   LOAD PERFORMANCE
========================================== */

async function loadPerformance() {

    try {


        const response =
            await fetch(
                "/api/students/" +
                studentId +
                "/performance"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load performance"
            );

        }


        const performance =
            await response.json();


        console.log(
            "Performance from MySQL:",
            performance
        );


        const table =
            document.getElementById(
                "performanceTable"
            );


        if (!performance.length) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="text-center text-muted"
                    >

                        No performance records found.

                    </td>

                </tr>

            `;

            return;
        }


        table.innerHTML =

            performance.map(
                record => `

                <tr>


                    <td>

                        ${record.exam || "-"}

                    </td>


                    <td>

                        ${record.subject || "-"}

                    </td>


                    <td>

                        <strong>

                            ${record.marks || 0}

                        </strong>

                    </td>


                </tr>

            `
            ).join("");


    }


    catch (error) {

        console.error(
            "Performance Error:",
            error
        );


        document.getElementById(
            "performanceTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="3"
                    class="text-center text-danger"
                >

                    Unable to load performance.

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   LOAD ATTENDANCE
========================================== */

async function loadAttendance() {

    try {


        const response =
            await fetch(
                "/api/students/" +
                studentId +
                "/attendance"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load attendance"
            );

        }


        const attendance =
            await response.json();


        console.log(
            "Attendance from MySQL:",
            attendance
        );


        const table =
            document.getElementById(
                "attendanceTable"
            );


        if (!attendance.length) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="2"
                        class="text-center text-muted"
                    >

                        No attendance records found.

                    </td>

                </tr>

            `;

            return;
        }


        table.innerHTML =

            attendance.map(
                record => `

                <tr>


                    <td>

                        ${record.date || "-"}

                    </td>


                    <td>


                        <span class="badge ${
                            record.status === "Present"

                                ? "bg-success"

                                : "bg-danger"
                        }">

                            ${record.status || "-"}

                        </span>


                    </td>


                </tr>

            `
            ).join("");


    }


    catch (error) {

        console.error(
            "Attendance Error:",
            error
        );


        document.getElementById(
            "attendanceTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="2"
                    class="text-center text-danger"
                >

                    Unable to load attendance.

                </td>

            </tr>

        `;

    }

}


/* ==========================================
   ERROR MESSAGE
========================================== */

function showError(message) {

    document.getElementById(
        "pageContent"
    ).innerHTML = `

        <div class="panel panel-body">


            <h5>

                ${message}

            </h5>


            <a
                href="students.html"
                class="btn btn-sm btn-outline-dark mt-3"
            >

                <i class="bi bi-arrow-left"></i>

                Back to Students

            </a>


        </div>

    `;

}


/* ==========================================
   START
========================================== */

loadStudentDetails();

</script>

</body>

</html>
