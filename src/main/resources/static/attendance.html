<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance | Genius Academy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<script src="js/app.js"></script>

<script>

    // ==========================================
    // LAYOUT
    // ==========================================

    renderLayout("attendance", "Attendance Management");


    // ==========================================
    // DATA
    // ==========================================

    let students = [];

    let attendance = [];

    let filteredAttendance = [];


    // ==========================================
    // LOAD DATA
    // ==========================================

    async function loadAttendance() {

        try {

            const [
                studentsResponse,
                attendanceResponse
            ] = await Promise.all([

                fetch("/api/students"),

                fetch("/api/attendance")

            ]);


            if (
                !studentsResponse.ok ||
                !attendanceResponse.ok
            ) {

                throw new Error(
                    "Unable to load attendance"
                );

            }


            students =
                await studentsResponse.json();

            attendance =
                await attendanceResponse.json();

            filteredAttendance =
                [...attendance];


            createPage();

            renderAttendance();

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "pageContent"
            ).innerHTML = `

                <div class="alert alert-danger">

                    <i class="bi bi-exclamation-triangle"></i>

                    Unable to load attendance data.

                    <br>

                    Please make sure Spring Boot
                    is running.

                </div>

            `;

        }

    }


    // ==========================================
    // CREATE PAGE
    // ==========================================

    function createPage() {

        document.getElementById(
            "pageContent"
        ).innerHTML = `

            <!-- PAGE HEADER -->

            <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-4
                        flex-wrap
                        gap-3">

                <div>

                    <h4 class="mb-1 fw-bold">

                        <i class="bi bi-calendar-check"></i>

                        Attendance

                    </h4>

                    <p class="text-muted mb-0">

                        Track student attendance records

                    </p>

                </div>


                <a
                    href="attendance-form.html"
                    class="btn btn-gold">

                    <i class="bi bi-plus-lg"></i>

                    Mark Attendance

                </a>

            </div>


            <!-- SUMMARY -->

            <div class="row g-3 mb-4">

                <div class="col-md-3">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-blue">

                                <i class="bi bi-calendar3"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Total Records

                                </div>

                                <h4
                                    id="totalRecords"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-3">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-green">

                                <i class="bi bi-check-circle"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Present

                                </div>

                                <h4
                                    id="presentRecords"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-3">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-red">

                                <i class="bi bi-x-circle"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Absent

                                </div>

                                <h4
                                    id="absentRecords"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-3">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-gold">

                                <i class="bi bi-clock"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Late

                                </div>

                                <h4
                                    id="lateRecords"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ATTENDANCE PANEL -->

            <div class="panel">

                <div class="panel-header">

                    <div>

                        <h5 class="mb-1">

                            <i class="bi bi-list-check"></i>

                            Attendance Records

                        </h5>

                        <small class="text-muted">

                            Search and filter attendance

                        </small>

                    </div>

                </div>


                <div class="panel-body">


                    <!-- FILTERS -->

                    <div class="row g-3 mb-4">

                        <div class="col-md-5">

                            <label
                                class="form-label fw-semibold">

                                Student

                            </label>

                            <select
                                id="studentFilter"
                                class="form-select">

                                <option value="">

                                    All Students

                                </option>

                            </select>

                        </div>


                        <div class="col-md-3">

                            <label
                                class="form-label fw-semibold">

                                Date

                            </label>

                            <input
                                type="date"
                                id="dateFilter"
                                class="form-control">

                        </div>


                        <div class="col-md-2">

                            <label
                                class="form-label fw-semibold">

                                Status

                            </label>

                            <select
                                id="statusFilter"
                                class="form-select">

                                <option value="">

                                    All Status

                                </option>

                                <option value="Present">

                                    Present

                                </option>

                                <option value="Absent">

                                    Absent

                                </option>

                                <option value="Late">

                                    Late

                                </option>

                            </select>

                        </div>


                        <div class="col-md-2
                                    d-flex
                                    align-items-end">

                            <button
                                type="button"
                                id="clearFilter"
                                class="btn btn-outline-secondary w-100">

                                <i class="bi bi-x-circle"></i>

                                Clear

                            </button>

                        </div>

                    </div>


                    <!-- TABLE -->

                    <div class="table-responsive">

                        <table
                            class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Student</th>

                                    <th>Date</th>

                                    <th>Status</th>

                                    <th>Actions</th>

                                </tr>

                            </thead>


                            <tbody
                                id="attendanceTableBody">

                                <tr>

                                    <td
                                        colspan="5"
                                        class="text-center py-4">

                                        Loading...

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        `;


        populateStudentFilter();

        setupFilters();

    }


    // ==========================================
    // STUDENT FILTER
    // ==========================================

    function populateStudentFilter() {

        const select =
            document.getElementById(
                "studentFilter"
            );


        students.forEach(student => {

            const id =
                student.id
                ??
                student.studentId;


            const name =
                student.name
                ??
                student.studentName
                ??
                "Unknown Student";


            const option =
                document.createElement(
                    "option"
                );


            option.value = id;

            option.textContent =
                name;


            select.appendChild(option);

        });

    }


    // ==========================================
    // FILTER SETUP
    // ==========================================

    function setupFilters() {

        document.getElementById(
            "studentFilter"
        ).addEventListener(
            "change",
            applyFilters
        );


        document.getElementById(
            "dateFilter"
        ).addEventListener(
            "change",
            applyFilters
        );


        document.getElementById(
            "statusFilter"
        ).addEventListener(
            "change",
            applyFilters
        );


        document.getElementById(
            "clearFilter"
        ).addEventListener(
            "click",
            clearFilters
        );

    }


    // ==========================================
    // APPLY FILTERS
    // ==========================================

    function applyFilters() {

        const studentId =
            document.getElementById(
                "studentFilter"
            ).value;


        const date =
            document.getElementById(
                "dateFilter"
            ).value;


        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        filteredAttendance =
            attendance.filter(record => {

                const recordStudentId =
                    record.studentId
                    ??
                    record.student_id;


                const recordDate =
                    record.attendanceDate
                    ??
                    record.date
                    ??
                    "";


                const recordStatus =
                    record.status
                    ??
                    "";


                const matchesStudent =
                    !studentId
                    ||
                    Number(recordStudentId)
                    === Number(studentId);


                const matchesDate =
                    !date
                    ||
                    String(recordDate)
                    === String(date);


                const matchesStatus =
                    !status
                    ||
                    String(recordStatus)
                    .toLowerCase()
                    === String(status)
                    .toLowerCase();


                return (
                    matchesStudent
                    &&
                    matchesDate
                    &&
                    matchesStatus
                );

            });


        renderAttendance();

    }


    // ==========================================
    // CLEAR FILTERS
    // ==========================================

    function clearFilters() {

        document.getElementById(
            "studentFilter"
        ).value = "";


        document.getElementById(
            "dateFilter"
        ).value = "";


        document.getElementById(
            "statusFilter"
        ).value = "";


        filteredAttendance =
            [...attendance];


        renderAttendance();

    }


    // ==========================================
    // STUDENT NAME
    // ==========================================

    function getStudentName(studentId) {

        const student =
            students.find(
                s =>
                    Number(
                        s.id
                        ??
                        s.studentId
                    )
                    === Number(studentId)
            );


        if (!student) {

            return "Unknown Student";

        }


        return (
            student.name
            ??
            student.studentName
            ??
            "Unknown Student"
        );

    }


    // ==========================================
    // DATE FORMAT
    // ==========================================

    function formatDate(value) {

        if (!value) {
            return "-";
        }


        const date =
            new Date(value);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleDateString(
            "en-GB"
        );

    }


    // ==========================================
    // STATUS BADGE
    // ==========================================

    function statusBadge(status) {

        const value =
            String(
                status ?? ""
            ).toLowerCase();


        if (value === "present") {

            return `

                <span
                    class="badge badge-present">

                    <i class="bi bi-check-circle"></i>

                    Present

                </span>

            `;

        }


        if (value === "absent") {

            return `

                <span
                    class="badge badge-absent">

                    <i class="bi bi-x-circle"></i>

                    Absent

                </span>

            `;

        }


        if (value === "late") {

            return `

                <span
                    class="badge badge-pending">

                    <i class="bi bi-clock"></i>

                    Late

                </span>

            `;

        }


        return `

            <span class="badge bg-secondary">

                ${status ?? "-"}

            </span>

        `;

    }


    // ==========================================
    // RENDER ATTENDANCE
    // ==========================================

    function renderAttendance() {

        const tbody =
            document.getElementById(
                "attendanceTableBody"
            );


        if (!tbody) {
            return;
        }


        // TOTAL

        document.getElementById(
            "totalRecords"
        ).textContent =
            filteredAttendance.length;


        // PRESENT

        const present =
            filteredAttendance.filter(
                record =>
                    String(
                        record.status
                        ?? ""
                    ).toLowerCase()
                    === "present"
            ).length;


        // ABSENT

        const absent =
            filteredAttendance.filter(
                record =>
                    String(
                        record.status
                        ?? ""
                    ).toLowerCase()
                    === "absent"
            ).length;


        // LATE

        const late =
            filteredAttendance.filter(
                record =>
                    String(
                        record.status
                        ?? ""
                    ).toLowerCase()
                    === "late"
            ).length;


        document.getElementById(
            "presentRecords"
        ).textContent = present;


        document.getElementById(
            "absentRecords"
        ).textContent = absent;


        document.getElementById(
            "lateRecords"
        ).textContent = late;


        // EMPTY

        if (
            filteredAttendance.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center py-5">

                        <i
                            class="bi bi-calendar-x fs-2
                                   text-muted">
                        </i>

                        <div
                            class="mt-2 text-muted">

                            No attendance records found.

                        </div>

                    </td>

                </tr>

            `;

            return;

        }


        // TABLE

        tbody.innerHTML =
            filteredAttendance
            .map(record => {

                const id =
                    record.id
                    ??
                    record.attendanceId
                    ??
                    record.attendance_id;


                const studentId =
                    record.studentId
                    ??
                    record.student_id;


                const date =
                    record.attendanceDate
                    ??
                    record.date
                    ??
                    "";


                const status =
                    record.status
                    ??
                    "-";


                return `

                    <tr>

                        <td>

                            <strong>
                                ${id}
                            </strong>

                        </td>


                        <td>

                            <strong>

                                ${getStudentName(
                                    studentId
                                )}

                            </strong>

                        </td>


                        <td>

                            ${formatDate(date)}

                        </td>


                        <td>

                            ${statusBadge(status)}

                        </td>


                        <td>

                            <div
                                class="d-flex
                                       gap-2
                                       flex-wrap">

                                <a
                                    href="attendance-form.html?id=${id}"
                                    class="btn btn-sm
                                           btn-outline-secondary">

                                    <i class="bi bi-pencil"></i>

                                    Edit

                                </a>


                                <button
                                    type="button"
                                    class="btn btn-sm
                                           btn-outline-danger"
                                    onclick="deleteAttendance(${id})">

                                    <i class="bi bi-trash"></i>

                                    Delete

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            })
            .join("");

    }


    // ==========================================
    // DELETE ATTENDANCE
    // ==========================================

    async function deleteAttendance(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this attendance record?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/attendance/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            alert(
                "Attendance deleted successfully."
            );


            await loadAttendance();

        }

        catch (error) {

            console.error(error);

            alert(
                "Unable to delete attendance."
            );

        }

    }


    // ==========================================
    // START
    // ==========================================

    loadAttendance();

</script>

</body>

</html>
