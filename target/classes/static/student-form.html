<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student | Genius Academy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<script src="js/app.js"></script>

<script>

renderLayout("students", "Student");


/* ==========================================
   CHECK IF EDIT MODE
========================================== */

const urlParams = new URLSearchParams(window.location.search);

const studentId = urlParams.get("id");

const isEditMode = studentId !== null;


/* ==========================================
   STUDENT FORM
========================================== */

document.getElementById("pageContent").innerHTML = `

    <div class="panel">

        <div class="panel-header">

            <strong id="formTitle">
                ${isEditMode ? "Edit Student" : "Add New Student"}
            </strong>

        </div>


        <div class="panel-body">

            <form id="studentForm">

                <div class="row g-3">


                    <!-- STUDENT NAME -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="studentName"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <!-- CLASS -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Class
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="studentClass"
                            placeholder="Example: 10"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="studentEmail"
                            placeholder="student@example.com"
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="studentPhone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- PARENT NAME -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Parent Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="parentName"
                            placeholder="Enter parent name"
                            required
                        >

                    </div>


                    <!-- JOIN DATE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Join Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="joinDate"
                            required
                        >

                    </div>


                    <!-- BUTTONS -->

                    <div class="col-12">

                        <button
                            type="submit"
                            class="btn btn-gold"
                            id="saveButton"
                        >

                            <i class="bi bi-check-lg"></i>

                            ${isEditMode ? "Update Student" : "Save Student"}

                        </button>


                        <a
                            href="students.html"
                            class="btn btn-outline-secondary ms-2"
                        >

                            Cancel

                        </a>

                    </div>

                </div>

            </form>

        </div>

    </div>

`;


/* ==========================================
   LOAD STUDENT FOR EDIT
========================================== */

function loadStudentForEdit() {

    if (!isEditMode) {

        document.getElementById("joinDate").value =
            new Date().toISOString().split("T")[0];

        return;
    }


    console.log("Loading student ID:", studentId);


    fetch("/api/students/" + studentId)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to load student"
                );

            }

            return response.json();

        })


        .then(student => {

            console.log(
                "Student loaded:",
                student
            );


            if (student.error) {

                alert(
                    "Error: " +
                    student.error
                );

                return;
            }


            if (!student.id) {

                alert(
                    "Student not found!"
                );

                return;
            }


            document.getElementById(
                "studentName"
            ).value =
                student.name || "";


            document.getElementById(
                "studentClass"
            ).value =
                student.className || "";


            document.getElementById(
                "studentPhone"
            ).value =
                student.phone || "";


            document.getElementById(
                "parentName"
            ).value =
                student.parentName || "";


            document.getElementById(
                "joinDate"
            ).value =
                student.joinDate || "";

        })


        .catch(error => {

            console.error(
                "Load Student Error:",
                error
            );

            alert(
                "Unable to load student."
            );

        });

}


/* ==========================================
   SAVE / UPDATE STUDENT
========================================== */

document.getElementById("studentForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const student = {

            name:
                document.getElementById(
                    "studentName"
                ).value.trim(),


            className:
                document.getElementById(
                    "studentClass"
                ).value.trim(),


            email:
                document.getElementById(
                    "studentEmail"
                ).value.trim(),


            phone:
                document.getElementById(
                    "studentPhone"
                ).value.trim(),


            parentName:
                document.getElementById(
                    "parentName"
                ).value.trim(),


            joinDate:
                document.getElementById(
                    "joinDate"
                ).value

        };


        console.log(
            "Student data:",
            student
        );


        /* ==================================
           EDIT STUDENT
        ================================== */

        if (isEditMode) {

            fetch(
                "/api/students/" + studentId,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(student)

                }

            )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to update student"
                    );

                }

                return response.json();

            })


            .then(result => {

                console.log(
                    "Update response:",
                    result
                );


                if (result.success) {

                    alert(
                        "Student updated successfully!"
                    );


                    window.location.href =
                        "students.html";

                }

                else {

                    alert(
                        "Update failed: " +
                        result.message
                    );

                }

            })


            .catch(error => {

                console.error(
                    "Update Student Error:",
                    error
                );


                alert(
                    "Unable to update student."
                );

            });


            return;
        }


        /* ==================================
           ADD NEW STUDENT
        ================================== */

        fetch("/api/students", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(student)

        })


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to save student"
                );

            }

            return response.json();

        })


        .then(result => {

            console.log(
                "Save response:",
                result
            );


            if (result.success) {

                alert(
                    "Student added successfully!"
                );


                window.location.href =
                    "students.html";

            }

            else {

                alert(
                    "Unable to save student: " +
                    result.message
                );

            }

        })


        .catch(error => {

            console.error(
                "Save Student Error:",
                error
            );


            alert(
                "Unable to save student."
            );

        });

    });


/* ==========================================
   START
========================================== */

loadStudentForEdit();

</script>

</body>

</html>
