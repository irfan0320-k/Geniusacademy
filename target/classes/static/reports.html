<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | Genius Academy</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">


    <style>

        /* =========================================
           REPORT HEADER
        ========================================== */

        .report-hero {

            background: linear-gradient(
                135deg,
                #0b1d33,
                #12304f
            );

            color: #ffffff;

            border-radius: 18px;

            padding: 24px;

            margin-bottom: 24px;

        }


        .report-hero h3 {

            font-weight: 800;

        }


        .report-icon {

            width: 48px;

            height: 48px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

        }


        /* =========================================
           FILTER PANEL
        ========================================== */

        .filter-panel {

            background: #ffffff;

            border: 1px solid var(--ga-border);

            border-radius: 16px;

            padding: 18px;

            box-shadow:
                0 8px 24px rgba(12,32,56,.04);

            margin-bottom: 24px;

        }


        /* =========================================
           REPORT CARDS
        ========================================== */

        .report-stat {

            background: #ffffff;

            border: 1px solid var(--ga-border);

            border-radius: 16px;

            padding: 18px;

            height: 100%;

            box-shadow:
                0 8px 24px rgba(12,32,56,.04);

        }


        .report-stat-number {

            font-size: 24px;

            font-weight: 800;

            margin-top: 5px;

        }


        /* =========================================
           TABLE
        ========================================== */

        .report-table {

            margin-bottom: 0;

        }


        .report-table th {

            white-space: nowrap;

        }


        .report-table td {

            vertical-align: middle;

        }


        /* =========================================
           PRINT
        ========================================== */

        @media print {

            .sidebar,
            .topbar,
            .filter-panel,
            .report-hero button,
            .no-print {

                display: none !important;

            }


            .main-wrap {

                margin-left: 0 !important;

            }


            .content {

                padding: 10px !important;

            }


            .panel,
            .report-stat {

                box-shadow: none !important;

                border: 1px solid #ddd !important;

            }

        }

    </style>

</head>


<body>


<script src="js/app.js"></script>


<script>

    // =====================================================
    // GLOBAL DATA
    // =====================================================

    let students = [];

    let fees = [];

    let attendance = [];

    let performance = [];


    // =====================================================
    // START LAYOUT
    // =====================================================

    renderLayout("reports", "Reports");


    // =====================================================
    // LOAD ALL DATA
    // =====================================================

    async function loadReports() {

        try {

            const [

                studentsResponse,

                feesResponse,

                attendanceResponse,

                performanceResponse

            ] = await Promise.all([

                fetch("/api/students"),

                fetch("/api/fees"),

                fetch("/api/attendance"),

                fetch("/api/performance")

            ]);


            if (

                !studentsResponse.ok ||

                !feesResponse.ok ||

                !attendanceResponse.ok ||

                !performanceResponse.ok

            ) {

                throw new Error(
                    "Unable to load report data"
                );

            }


            students =
                await studentsResponse.json();


            fees =
                await feesResponse.json();


            attendance =
                await attendanceResponse.json();


            performance =
                await performanceResponse.json();


            createReportsPage();

            populateStudentFilter();

            renderAllReports();

        }


        catch (error) {

            console.error(error);


            document.getElementById(
                "pageContent"
            ).innerHTML = `

                <div class="alert alert-danger">

                    <h5 class="fw-bold">

                        <i class="bi bi-exclamation-triangle"></i>

                        Unable to load reports

                    </h5>

                    <p class="mb-0">

                        Please make sure Spring Boot
                        and MySQL are running.

                    </p>

                </div>

            `;

        }

    }


    // =====================================================
    // CREATE PAGE
    // =====================================================

    function createReportsPage() {

        document.getElementById(
            "pageContent"
        ).innerHTML = `


            <!-- =========================================
                 HERO
            ========================================== -->

            <div class="report-hero">

                <div class="row align-items-center">

                    <div class="col-md-8">

                        <div class="small opacity-75 mb-2">

                            GENIUS ACADEMY

                        </div>


                        <h3 class="mb-2">

                            Reports & Analytics

                        </h3>


                        <p class="mb-0 opacity-75">

                            View student, fees, attendance
                            and academic performance
                            reports in one place.

                    </div>


                    <div class="col-md-4 text-md-end mt-3 mt-md-0">

                        <button

                            Print Report

                </div>

            </div>


            <!-- =========================================
                 SUMMARY
            ========================================== -->

            <div class="row g-3 mb-4">


                <!-- STUDENTS -->

                <div class="col-xl-3 col-md-6">

                    <div class="report-stat">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">

                                    Students

                                </div>


                                <div
                                    id="summaryStudents"
                                    class="report-stat-number">

                                    0

                                </div>

                            </div>


                            <div class="report-icon icon-blue">

                                <i class="bi bi-people-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- FEES -->

                <div class="col-xl-3 col-md-6">

                    <div class="report-stat">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">

                                    Paid Fees

                                </div>


                                <div
                                    id="summaryFees"
                                    class="report-stat-number">

                                    ₹0.00

                                </div>

                            </div>


                            <div class="report-icon icon-gold">

                                <i class="bi bi-cash-stack"></i>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ATTENDANCE -->

                <div class="col-xl-3 col-md-6">

                    <div class="report-stat">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">

                                    Present Records

                                </div>


                                <div
                                    id="summaryAttendance"
                                    class="report-stat-number">

                                    0

                                </div>

                            </div>


                            <div class="report-icon icon-green">

                                <i class="bi bi-calendar-check"></i>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- PERFORMANCE -->

                <div class="col-xl-3 col-md-6">

                    <div class="report-stat">

                        <div class="d-flex
                                    justify-content-between
                                    align-items-center">

                            <div>

                                <div class="text-muted small">

                                    Performance

                                </div>


                                <div
                                    id="summaryPerformance"
                                    class="report-stat-number">

                                    0

                                </div>

                            </div>


                            <div class="report-icon icon-blue">

                                <i class="bi bi-bar-chart-fill"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 FILTERS
            ========================================== -->

            <div class="filter-panel no-print">

                <div class="row g-3 align-items-end">


                    <!-- STUDENT -->

                    <div class="col-lg-4">

                        <label
                            class="form-label fw-semibold">

                            Student

                        </label>


                        <select
                            id="studentFilter"
                            class="form-select">

                            <option value="">

                                All Students

                        </select>

                    </div>


                    <!-- STATUS -->

                    <div class="col-lg-3">

                        <label
                            class="form-label fw-semibold">

                            Status

                        </label>


                        <select
                            id="statusFilter"
                            class="form-select">

                            <option value="">

                                All Status

                            </option>

                            <option value="Paid">

                                Paid

                            </option>

                            <option value="Pending">

                                Pending

                            </option>

                            <option value="Present">

                                Present

                            </option>

                            <option value="Absent">

                                Absent

                            </option>

                            <option value="Late">

                                Late

                            </option>

                        </select>

                    </div>


                    <!-- DATE -->

                    <div class="col-lg-3">

                        <label
                            class="form-label fw-semibold">

                            Date

                        </label>


                        <input
                            type="date"
                            id="dateFilter"
                            class="form-control">

                    </div>


                    <!-- CLEAR -->

                    <div class="col-lg-2">

                        <button
                            onclick="clearFilters()"

                            <i class="bi bi-x-circle"></i>

                            Clear

                        </button>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 STUDENT REPORT
            ========================================== -->

            <div class="panel mb-4">

                <div class="panel-header">

                    <div>

                        <h5 class="mb-1">

                            <i class="bi bi-people-fill"></i>

                            Student Report

                        </h5>


                        <small class="text-muted">

                            Registered student details

                        </small>

                    </div>

                </div>


                <div class="panel-body">

                    <div class="table-responsive">

                        <table
                            class="table table-hover report-table">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Name</th>

                                    <th>Class</th>

                                    <th>Phone</th>

                                    <th>Parent</th>

                                    <th>Status</th>

                                </tr>

                            </thead>


                            <tbody
                                id="studentReportBody">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 FEES REPORT
            ========================================== -->

            <div class="panel mb-4">

                <div class="panel-header">

                    <div>

                        <h5 class="mb-1">

                            <i class="bi bi-cash-stack"></i>

                            Fees Report

                        </h5>


                        <small class="text-muted">

                            Student fee transactions

                        </small>

                    </div>

                </div>


                <div class="panel-body">

                    <div class="table-responsive">

                        <table
                            class="table table-hover report-table">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Student</th>

                                    <th>Amount</th>

                                    <th>Payment Date</th>

                                    <th>Status</th>

                                </tr>

                            </thead>


                            <tbody
                                id="feesReportBody">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 ATTENDANCE REPORT
            ========================================== -->

            <div class="panel mb-4">

                <div class="panel-header">

                    <div>

                        <h5 class="mb-1">

                            <i class="bi bi-calendar-check"></i>

                            Attendance Report

                        </h5>


                        <small class="text-muted">

                            Student attendance records

                        </small>

                    </div>

                </div>


                <div class="panel-body">

                    <div class="table-responsive">

                        <table
                            class="table table-hover report-table">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Student</th>

                                    <th>Date</th>

                                    <th>Status</th>

                                </tr>

                            </thead>


                            <tbody
                                id="attendanceReportBody">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


            <!-- =========================================
                 PERFORMANCE REPORT
            ========================================== -->

            <div class="panel">

                <div class="panel-header">

                    <div>

                        <h5 class="mb-1">

                            <i class="bi bi-trophy-fill"></i>

                            Performance Report

                        </h5>


                        <small class="text-muted">

                            Academic performance records

                        </small>

                    </div>

                </div>


                <div class="panel-body">

                    <div class="table-responsive">

                        <table
                            class="table table-hover report-table">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Student</th>

                                    <th>Subject</th>

                                    <th>Exam</th>

                                    <th>Marks</th>

                                    <th>Result</th>

                                </tr>

                            </thead>


                            <tbody
                                id="performanceReportBody">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        `;


        // Filter events

        document.getElementById(
            "studentFilter"
        ).addEventListener(
            "change",
            renderAllReports
        );


        document.getElementById(
            "statusFilter"
        ).addEventListener(
            "change",
            renderAllReports
        );


        document.getElementById(
            "dateFilter"
        ).addEventListener(
            "change",
            renderAllReports
        );

    }


    // =====================================================
    // STUDENT FILTER
    // =====================================================

    function populateStudentFilter() {

        const select =
            document.getElementById(
                "studentFilter"
            );


        students.forEach(student => {

            const id =
                student.id
                ??
                student.studentId
                ??
                student.student_id;


            const name =
                student.name
                ??
                student.studentName
                ??
                student.student_name
                ??
                "Unknown Student";


            const option =
                document.createElement("option");


            option.value = id;

            option.textContent =
                name;


            select.appendChild(option);

        });

    }


    // =====================================================
    // STUDENT NAME
    // =====================================================

    function getStudentName(studentId) {

        const student =
            students.find(
                item =>
                    Number(
                        item.id
                        ??
                        item.studentId
                        ??
                        item.student_id
                    )
                    ===
                    Number(studentId)
            );


        if (!student) {

            return "Unknown Student";

        }


        return (

            student.name
            ??
            student.studentName
            ??
            student.student_name
            ??
            "Unknown Student"

        );

    }


    // =====================================================
    // SELECTED STUDENT
    // =====================================================

    function getSelectedStudent() {

        return document.getElementById(
            "studentFilter"
        ).value;

    }


    // =====================================================
    // DATE FORMAT
    // =====================================================

    function formatDate(value) {

        if (!value) {

            return "-";

        }


        const date =
            new Date(value);


        if (isNaN(date.getTime())) {

            return value;

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

    }


    // =====================================================
    // RENDER ALL
    // =====================================================

    function renderAllReports() {

        renderSummary();

        renderStudentReport();

        renderFeesReport();

        renderAttendanceReport();

        renderPerformanceReport();

    }


    // =====================================================
    // SUMMARY
    // =====================================================

    function renderSummary() {

        document.getElementById(
            "summaryStudents"
        ).textContent =
            students.length;


        const paidFees =
            fees
                .filter(
                    fee =>
                        String(
                            fee.status
                            ??
                            ""
                        ).toLowerCase()
                        === "paid"
                )
                .reduce(
                    (total, fee) =>
                        total +
                        Number(
                            fee.amount
                            ??
                            0
                        ),
                    0
                );


        document.getElementById(
            "summaryFees"
        ).textContent =
            "₹" +
            paidFees.toFixed(2);


        const presentCount =
            attendance.filter(
                record =>
                    String(
                        record.status
                        ??
                        ""
                    ).toLowerCase()
                    === "present"
            ).length;


        document.getElementById(
            "summaryAttendance"
        ).textContent =
            presentCount;


        document.getElementById(
            "summaryPerformance"
        ).textContent =
            performance.length;

    }


    // =====================================================
    // STUDENT REPORT
    // =====================================================

    function renderStudentReport() {

        const tbody =
            document.getElementById(
                "studentReportBody"
            );


        const selectedStudent =
            getSelectedStudent();


        let data =
            [...students];


        if (selectedStudent) {

            data =
                data.filter(
                    student =>
                        String(
                            student.id
                            ??
                            student.studentId
                            ??
                            student.student_id
                        )
                        ===
                        String(
                            selectedStudent
                        )
                );

        }


        if (!data.length) {

            tbody.innerHTML = emptyRow(
                6,
                "No students found."
            );

            return;

        }


        tbody.innerHTML =

            data.map(student => {

                const id =
                    student.id
                    ??
                    student.studentId
                    ??
                    student.student_id
                    ??
                    "-";


                const name =
                    student.name
                    ??
                    student.studentName
                    ??
                    student.student_name
                    ??
                    "-";


                const standard =
                    student.standard
                    ??
                    student.className
                    ??
                    student.class
                    ??
                    "-";


                const phone =
                    student.phone
                    ??
                    "-";


                const parent =
                    student.parentName
                    ??
                    student.parent_name
                    ??
                    student.parent
                    ??
                    "-";


                const status =
                    student.status
                    ??
                    "Active";


                return `

                    <tr>

                        <td>

                            ${id}

                        </td>

                        <td>

                            <strong>

                                ${name}

                            </strong>

                        </td>

                        <td>

                            <span class="badge bg-light text-dark">

                                Class ${standard}

                            </span>

                        </td>

                        <td>

                            ${phone}

                        </td>

                        <td>

                            ${parent}

                        </td>

                        <td>

                            <span
                                class="badge badge-present">

                                ${status}

                            </span>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    // =====================================================
    // FEES REPORT
    // =====================================================

    function renderFeesReport() {

        const tbody =
            document.getElementById(
                "feesReportBody"
            );


        const selectedStudent =
            getSelectedStudent();


        const selectedStatus =
            document.getElementById(
                "statusFilter"
            ).value;


        const selectedDate =
            document.getElementById(
                "dateFilter"
            ).value;


        let data =
            [...fees];


        if (selectedStudent) {

            data =
                data.filter(
                    fee =>
                        String(
                            fee.studentId
                            ??
                            fee.student_id
                        )
                        ===
                        String(
                            selectedStudent
                        )
                );

        }


        if (
            selectedStatus === "Paid" ||
            selectedStatus === "Pending"
        ) {

            data =
                data.filter(
                    fee =>
                        String(
                            fee.status
                            ??
                            ""
                        ).toLowerCase()
                        ===
                        selectedStatus.toLowerCase()
                );

        }


        if (selectedDate) {

            data =
                data.filter(
                    fee => {

                        const date =
                            String(
                                fee.paymentDate
                                ??
                                fee.payment_date
                                ??
                                ""
                            ).substring(0, 10);


                        return date === selectedDate;

                    }
                );

        }


        if (!data.length) {

            tbody.innerHTML = emptyRow(
                5,
                "No fee records found."
            );

            return;

        }


        tbody.innerHTML =

            data.map(fee => {

                const id =
                    fee.feeId
                    ??
                    fee.id
                    ??
                    fee.fee_id
                    ??
                    "-";


                const studentId =
                    fee.studentId
                    ??
                    fee.student_id;


                const studentName =
                    getStudentName(
                        studentId
                    );


                const amount =
                    Number(
                        fee.amount
                        ??
                        0
                    );


                const paymentDate =
                    fee.paymentDate
                    ??
                    fee.payment_date
                    ??
                    null;


                const status =
                    fee.status
                    ??
                    "Pending";


                const badge =
                    String(status)
                    .toLowerCase()
                    === "paid"
                    ? "badge-paid"
                    : "badge-pending";


                return `

                    <tr>

                        <td>

                            ${id}

                        </td>


                        <td>

                            <strong>

                                ${studentName}

                            </strong>

                        </td>


                        <td>

                            <strong>

                                ₹${amount.toFixed(2)}

                            </strong>

                        </td>


                        <td>

                            ${formatDate(paymentDate)}

                        </td>


                        <td>

                            <span
                                class="badge ${badge}">

                                ${status}

                            </span>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    // =====================================================
    // ATTENDANCE REPORT
    // =====================================================

    function renderAttendanceReport() {

        const tbody =
            document.getElementById(
                "attendanceReportBody"
            );


        const selectedStudent =
            getSelectedStudent();


        const selectedStatus =
            document.getElementById(
                "statusFilter"
            ).value;


        const selectedDate =
            document.getElementById(
                "dateFilter"
            ).value;


        let data =
            [...attendance];


        if (selectedStudent) {

            data =
                data.filter(
                    record =>
                        String(
                            record.studentId
                            ??
                            record.student_id
                        )
                        ===
                        String(
                            selectedStudent
                        )
                );

        }


        if (
            selectedStatus === "Present" ||
            selectedStatus === "Absent" ||
            selectedStatus === "Late"
        ) {

            data =
                data.filter(
                    record =>
                        String(
                            record.status
                            ??
                            ""
                        ).toLowerCase()
                        ===
                        selectedStatus.toLowerCase()
                );

        }


        if (selectedDate) {

            data =
                data.filter(
                    record => {

                        const date =
                            String(
                                record.attendanceDate
                                ??
                                record.attendance_date
                                ??
                                ""
                            ).substring(0, 10);


                        return date === selectedDate;

                    }
                );

        }


        if (!data.length) {

            tbody.innerHTML = emptyRow(
                4,
                "No attendance records found."
            );

            return;

        }


        tbody.innerHTML =

            data.map(record => {

                const id =
                    record.attendanceId
                    ??
                    record.id
                    ??
                    record.attendance_id
                    ??
                    "-";


                const studentId =
                    record.studentId
                    ??
                    record.student_id;


                const studentName =
                    getStudentName(
                        studentId
                    );


                const date =
                    record.attendanceDate
                    ??
                    record.attendance_date
                    ??
                    null;


                const status =
                    record.status
                    ??
                    "-";


                let badge =
                    "badge-present";


                if (
                    String(status)
                    .toLowerCase()
                    === "absent"
                ) {

                    badge =
                        "badge-absent";

                }


                return `

                    <tr>

                        <td>

                            ${id}

                        </td>


                        <td>

                            <strong>

                                ${studentName}

                            </strong>

                        </td>


                        <td>

                            ${formatDate(date)}

                        </td>


                        <td>

                            <span
                                class="badge ${badge}">

                                ${status}

                            </span>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    // =====================================================
    // PERFORMANCE REPORT
    // =====================================================

    function renderPerformanceReport() {

        const tbody =
            document.getElementById(
                "performanceReportBody"
            );


        const selectedStudent =
            getSelectedStudent();


        let data =
            [...performance];


        if (selectedStudent) {

            data =
                data.filter(
                    record =>
                        String(
                            record.studentId
                            ??
                            record.student_id
                        )
                        ===
                        String(
                            selectedStudent
                        )
                );

        }


        if (!data.length) {

            tbody.innerHTML = emptyRow(
                6,
                "No performance records found."
            );

            return;

        }


        tbody.innerHTML =

            data.map(record => {

                const id =
                    record.performanceId
                    ??
                    record.id
                    ??
                    record.performance_id
                    ??
                    "-";


                const studentId =
                    record.studentId
                    ??
                    record.student_id;


                const studentName =
                    getStudentName(
                        studentId
                    );


                const subject =
                    record.subject
                    ??
                    "-";


                const exam =
                    record.examName
                    ??
                    record.exam
                    ??
                    record.exam_name
                    ??
                    "-";


                const marks =
                    Number(
                        record.marks
                        ??
                        0
                    );


                const result =
                    marks >= 40
                    ? "Pass"
                    : "Fail";


                const badge =
                    result === "Pass"
                    ? "badge-present"
                    : "badge-absent";


                return `

                    <tr>

                        <td>

                            ${id}

                        </td>


                        <td>

                            <strong>

                                ${studentName}

                            </strong>

                        </td>


                        <td>

                            ${subject}

                        </td>


                        <td>

                            ${exam}

                        </td>


                        <td>

                            <strong>

                                ${marks}

                            </strong>

                            / 100

                        </td>


                        <td>

                            <span
                                class="badge ${badge}">

                                ${result}

                            </span>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    // =====================================================
    // EMPTY ROW
    // =====================================================

    function emptyRow(
        colspan,
        message
    ) {

        return `

            <tr>

                <td
                    colspan="${colspan}"
                    class="text-center text-muted py-4">

                    <i class="bi bi-inbox"></i>

                    <div class="mt-2">

                        ${message}

                    </div>

                </td>

            </tr>

        `;

    }


    // =====================================================
    // CLEAR FILTERS
    // =====================================================

    function clearFilters() {

        document.getElementById(
            "studentFilter"
        ).value = "";


        document.getElementById(
            "statusFilter"
        ).value = "";


        document.getElementById(
            "dateFilter"
        ).value = "";


        renderAllReports();

    }


    // =====================================================
    // START
    // =====================================================

    loadReports();

</script>


</body>

</html>
