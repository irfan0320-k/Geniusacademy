<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student ID Card | Genius Academy</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", sans-serif;
            background: #eef3f9;
            color: #10233d;
        }

        /* =====================================
           TOP HEADER
        ====================================== */

        .site-header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;

            display: flex;
            align-items: center;

            padding: 0 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            border-radius: 12px;
            overflow: hidden;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;

            color: #0b1d33;

            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 10px;
            color: #728198;

            margin-top: 3px;
        }

        /* =====================================
           PAGE
        ====================================== */

        .page-wrapper {
            max-width: 1150px;

            margin: 0 auto;

            padding: 30px 24px 50px;
        }

        .page-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 26px;
        }

        .page-heading h1 {
            margin: 0;

            font-size: 24px;
            font-weight: 800;

            color: #10233d;
        }

        .page-heading p {
            margin: 5px 0 0;

            color: #708198;

            font-size: 13px;
        }

        /* =====================================
           BUTTONS
        ====================================== */

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-back {
            border: 1px solid #dbe3ed;

            background: #ffffff;

            color: #10233d;

            border-radius: 8px;

            padding: 9px 15px;

            font-size: 13px;
            font-weight: 700;
        }

        .btn-back:hover {
            background: #f7f9fc;
        }

        .btn-print {
            border: none;

            background: #c9a227;

            color: #10233d;

            border-radius: 8px;

            padding: 9px 16px;

            font-size: 13px;
            font-weight: 800;
        }

        .btn-print:hover {
            background: #b8931f;
        }

        /* =====================================
           CARD AREA
        ====================================== */

        .card-area {
            display: flex;

            justify-content: center;

            align-items: flex-start;
        }

        /* =====================================
           STUDENT ID CARD
        ====================================== */

        .id-card {
            width: 390px;

            min-height: 620px;

            background: #ffffff;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 18px 45px rgba(11, 29, 51, 0.16);

            position: relative;
        }

        /* =====================================
           CARD HEADER
        ====================================== */

        .id-card-header {
            height: 175px;

            background:
                linear-gradient(
                    135deg,
                    #071c34 0%,
                    #0d2948 55%,
                    #123c62 100%
                );

            color: #ffffff;

            text-align: center;

            padding: 22px 20px;

            position: relative;

            overflow: hidden;
        }

        .id-card-header::before {
            content: "";

            position: absolute;

            width: 115px;
            height: 115px;

            border-radius: 50%;

            background:
                rgba(201, 162, 39, 0.12);

            right: -35px;
            top: -40px;
        }

        .id-card-header::after {
            content: "";

            position: absolute;

            width: 80px;
            height: 80px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.05);

            left: -35px;
            bottom: -30px;
        }

        .card-logo {
            width: 55px;
            height: 55px;

            border-radius: 15px;

            object-fit: cover;

            position: relative;

            z-index: 2;

            background: #ffffff;

            padding: 2px;
        }

        .academy-name {
            margin-top: 10px;

            font-size: 19px;

            font-weight: 800;

            letter-spacing: 0.2px;

            position: relative;

            z-index: 2;
        }

        .academy-tagline {
            font-size: 9px;

            color: #d9e3ef;

            margin-top: 2px;

            position: relative;

            z-index: 2;
        }

        .id-badge {
            display: inline-block;

            margin-top: 10px;

            background: #c9a227;

            color: #10233d;

            font-size: 9px;

            font-weight: 800;

            padding: 6px 15px;

            border-radius: 20px;

            letter-spacing: 0.5px;

            position: relative;

            z-index: 2;
        }

        /* =====================================
           PROFILE
        ====================================== */

        .profile-section {
            text-align: center;

            padding: 24px 24px 12px;
        }

        .profile-photo {
            width: 94px;
            height: 94px;

            border-radius: 50%;

            background: #e8f0f8;

            border: 5px solid #ffffff;

            box-shadow:
                0 4px 15px rgba(16, 35, 61, 0.16);

            margin: -2px auto 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #8195ad;

            font-size: 38px;
        }

        .student-name {
            font-size: 20px;

            font-weight: 800;

            color: #10233d;

            margin: 0;
        }

        .student-id {
            margin-top: 5px;

            font-size: 11px;

            color: #c19517;

            font-weight: 800;

            letter-spacing: 1px;
        }

        /* =====================================
           DETAILS
        ====================================== */

        .details {
            padding: 8px 24px 22px;
        }

        .detail-row {
            min-height: 43px;

            border-bottom: 1px solid #e8edf3;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #718299;

            font-size: 10px;

            font-weight: 500;
        }

        .detail-value {
            color: #10233d;

            font-size: 11px;

            font-weight: 700;

            text-align: right;

            max-width: 210px;

            word-break: break-word;
        }

        /* =====================================
           FOOTER
        ====================================== */

        .id-card-footer {
            background: #f7f9fc;

            border-top: 1px solid #e7edf4;

            text-align: center;

            padding: 15px 20px;
        }

        .footer-main {
            font-size: 10px;

            font-weight: 800;

            color: #10233d;
        }

        .footer-dev {
            margin-top: 4px;

            font-size: 8px;

            color: #8a98aa;
        }

        /* =====================================
           LOADING
        ====================================== */

        .loading-box {
            width: 390px;

            min-height: 620px;

            background: #ffffff;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            box-shadow:
                0 18px 45px rgba(11, 29, 51, 0.12);
        }

        .loading-box i {
            font-size: 32px;

            color: #c9a227;

            margin-bottom: 12px;
        }

        .loading-box p {
            margin: 0;

            font-size: 13px;

            color: #718299;
        }

        /* =====================================
           ERROR
        ====================================== */

        .error-box {
            width: 390px;

            min-height: 300px;

            background: #ffffff;

            border-radius: 20px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 18px 45px rgba(11, 29, 51, 0.12);
        }

        .error-box i {
            font-size: 45px;

            color: #d64545;

            margin-bottom: 15px;
        }

        .error-box h3 {
            font-size: 18px;

            font-weight: 800;

            color: #10233d;
        }

        .error-box p {
            color: #718299;

            font-size: 13px;

            margin-bottom: 20px;
        }

        /* =====================================
           RESPONSIVE
        ====================================== */

        @media (max-width: 576px) {

            .site-header {
                padding: 0 15px;
            }

            .page-wrapper {
                padding: 20px 12px 35px;
            }

            .page-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions button {
                flex: 1;
            }

            .id-card,
            .loading-box,
            .error-box {
                width: 100%;

                max-width: 390px;
            }

            .id-card {
                min-height: 600px;
            }
        }

        /* =====================================
           PRINT
        ====================================== */

        @media print {

            @page {
                size: A4 portrait;

                margin: 0;
            }

            html,
            body {
                width: 100%;

                min-height: 100%;

                background: #ffffff !important;
            }

            body {
                margin: 0;

                padding: 0;
            }

            .site-header,
            .page-header {
                display: none !important;
            }

            .page-wrapper {
                max-width: none;

                margin: 0;

                padding: 0;
            }

            .card-area {
                display: flex;

                justify-content: center;

                align-items: flex-start;

                padding-top: 25mm;
            }

            .id-card {
                width: 390px;

                min-height: 620px;

                box-shadow: none !important;

                border: 1px solid #dfe6ee;

                border-radius: 20px;
            }

            .id-card-header {
                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }

            .id-card-footer {
                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }

            .id-badge {
                -webkit-print-color-adjust: exact;

                print-color-adjust: exact;
            }
        }

    </style>

</head>

<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="site-header">

        <div class="brand">

            <div class="brand-logo">

                <img
                    src="images/logo.png"
                    alt="Genius Academy Logo"
                >

            </div>

            <div>

                <div class="brand-title">
                    GENIUS ACADEMY
                </div>

                <div class="brand-subtitle">
                    Tuition Management System
                </div>

            </div>

        </div>

    </header>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="page-wrapper">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div class="page-heading">

                <h1>
                    Student ID Card
                </h1>

                <p>
                    Generate and print student identification card
                </p>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="btn-back"
                    onclick="goBack()"
                >

                    <i class="bi bi-arrow-left"></i>

                    Back

                </button>


                <button
                    type="button"
                    class="btn-print"
                    onclick="printCard()"
                >

                    <i class="bi bi-printer"></i>

                    Print ID Card

                </button>

            </div>

        </div>


        <!-- CARD AREA -->

        <div
            class="card-area"
            id="cardArea"
        >

            <div class="loading-box">

                <i class="bi bi-arrow-repeat"></i>

                <p>
                    Loading student information...
                </p>

            </div>

        </div>


    </main>


    <script>

        /* =====================================
           GET ID FROM URL
        ====================================== */

        const params =
            new URLSearchParams(window.location.search);

        const studentId =
            params.get("id");


        /* =====================================
           BACK
        ====================================== */

        function goBack() {

            window.location.href =
                "students.html";

        }


        /* =====================================
           PRINT
        ====================================== */

        function printCard() {

            window.print();

        }


        /* =====================================
           FORMAT DATE
        ====================================== */

        function formatDate(dateValue) {

            if (
                !dateValue ||
                String(dateValue).trim() === ""
            ) {

                return "-";

            }


            const parts =
                String(dateValue).split("-");


            if (parts.length === 3) {

                return `${parts[2]}/${parts[1]}/${parts[0]}`;

            }


            try {

                const date =
                    new Date(dateValue);

                if (
                    !isNaN(date.getTime())
                ) {

                    const day =
                        String(
                            date.getDate()
                        ).padStart(2, "0");

                    const month =
                        String(
                            date.getMonth() + 1
                        ).padStart(2, "0");

                    const year =
                        date.getFullYear();

                    return `${day}/${month}/${year}`;

                }

            } catch (error) {

                console.error(
                    "Date formatting error:",
                    error
                );

            }


            return dateValue;

        }


        /* =====================================
           ESCAPE HTML
        ====================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined ||
                String(value).trim() === ""
            ) {

                return "-";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           LOAD STUDENT
        ====================================== */

        async function loadStudent() {

            const cardArea =
                document.getElementById(
                    "cardArea"
                );


            /* No ID */

            if (!studentId) {

                showError(
                    "Student ID Missing",
                    "No student ID was provided in the URL."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/students/${encodeURIComponent(studentId)}`
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const student =
                    await response.json();


                console.log(
                    "Student API Response:",
                    student
                );


                renderStudentCard(
                    student
                );


            } catch (error) {

                console.error(
                    "Error loading student:",
                    error
                );


                showError(
                    "Unable to Load Student",
                    "Student information could not be loaded from the database."
                );

            }

        }


        /* =====================================
           RENDER CARD
        ====================================== */

        function renderStudentCard(student) {


            /* ================================
               ACTUAL API FIELDS
            ================================= */

            const id =
                student.id;


            const name =
                student.name;


            const className =
                student.className;


            const parentName =
                student.parentName;


            const phone =
                student.phone;


            const joinDate =
                student.joinDate;


            /* ================================
               STUDENT ID
            ================================= */

            const formattedId =
                "GA-" +
                String(id)
                    .padStart(4, "0");


            /* ================================
               SECTION
               
               API currently does not provide
               section, so show "-"
            ================================= */

            const section =
                "-";


            /* ================================
               STATUS
            ================================= */

            const status =
                student.status ||
                "Active";


            /* ================================
               CARD AREA
            ================================= */

            const cardArea =
                document.getElementById(
                    "cardArea"
                );


            /* ================================
               HTML
            ================================= */

            cardArea.innerHTML = `

                <div class="id-card">


                    <!-- CARD HEADER -->

                    <div class="id-card-header">


                        <img
                            src="images/logo.png"
                            class="card-logo"
                            alt="Genius Academy Logo"
                        >


                        <div class="academy-name">

                            GENIUS ACADEMY

                        </div>


                        <div class="academy-tagline">

                            Tuition Management System

                        </div>


                        <div class="id-badge">

                            STUDENT ID CARD

                        </div>


                    </div>



                    <!-- PROFILE -->

                    <div class="profile-section">


                        <div class="profile-photo">

                            <i class="bi bi-person-fill"></i>

                        </div>


                        <h2 class="student-name">

                            ${escapeHtml(name)}

                        </h2>


                        <div class="student-id">

                            STUDENT ID:
                            ${escapeHtml(formattedId)}

                        </div>


                    </div>



                    <!-- DETAILS -->

                    <div class="details">


                        <!-- CLASS -->

                        <div class="detail-row">

                            <div class="detail-label">

                                Class

                            </div>


                            <div class="detail-value">

                                ${escapeHtml(className)}

                            </div>

                        </div>



                        <!-- SECTION -->

                        <div class="detail-row">

                            <div class="detail-label">

                                Section

                            </div>


                            <div class="detail-value">

                                ${escapeHtml(section)}

                            </div>

                        </div>



                        <!-- PARENT -->

                        <div class="detail-row">

                            <div class="detail-label">

                                Parent / Guardian

                            </div>


                            <div class="detail-value">

                                ${escapeHtml(parentName)}

                            </div>

                        </div>



                        <!-- PHONE -->

                        <div class="detail-row">

                            <div class="detail-label">

                                Phone

                            </div>


                            <div class="detail-value">

                                ${escapeHtml(phone)}

                            </div>

                        </div>



                        <!-- JOIN DATE -->

                        <div class="detail-row">

                            <div class="detail-label">

                                Admission Date

                            </div>


                            <div class="detail-value">

                                ${escapeHtml(
                                    formatDate(joinDate)
                                )}

                            </div>

                        </div>



                        <!-- STATUS -->

                        <div class="detail-row">

                            <div class="detail-label">

                                Status

                            </div>


                            <div class="detail-value">

                                ${escapeHtml(status)}

                            </div>

                        </div>


                    </div>



                    <!-- FOOTER -->

                    <div class="id-card-footer">


                        <div class="footer-main">

                            This card is property of
                            Genius Academy

                        </div>


                        <div class="footer-dev">

                            Developed by Irfan Hussain

                        </div>


                    </div>


                </div>

            `;

        }


        /* =====================================
           ERROR
        ====================================== */

        function showError(
            title,
            message
        ) {

            const cardArea =
                document.getElementById(
                    "cardArea"
                );


            cardArea.innerHTML = `

                <div class="error-box">


                    <i class="bi bi-exclamation-triangle-fill"></i>


                    <h3>

                        ${escapeHtml(title)}

                    </h3>


                    <p>

                        ${escapeHtml(message)}

                    </p>


                    <button
                        class="btn btn-dark"
                        onclick="goBack()"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Back to Students

                    </button>


                </div>

            `;

        }


        /* =====================================
           START
        ====================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadStudent();

            }
        );

    </script>


</body>
</html>
