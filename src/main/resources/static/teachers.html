<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teachers | Genius Academy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<script src="js/app.js"></script>

<script>

    // ==========================================
    // LAYOUT
    // ==========================================

    renderLayout("teachers", "Teacher Management");


    // ==========================================
    // DATA
    // ==========================================

    let teachers = [];

    let filteredTeachers = [];


    // ==========================================
    // LOAD TEACHERS
    // ==========================================

    async function loadTeachers() {

        try {

            const response =
                await fetch("/api/teachers");

            if (!response.ok) {

                throw new Error(
                    "Unable to load teachers"
                );

            }

            teachers =
                await response.json();

            filteredTeachers =
                [...teachers];

            createPage();

            renderTeachers();

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "pageContent"
            ).innerHTML = `

                <div class="alert alert-danger">

                    <i class="bi bi-exclamation-triangle"></i>

                    Unable to load teachers.

                    <br>

                    Please make sure Spring Boot
                    is running.

                </div>

            `;

        }

    }


    // ==========================================
    // CREATE PAGE
    // ==========================================

    function createPage() {

        document.getElementById(
            "pageContent"
        ).innerHTML = `

            <!-- PAGE HEADER -->

            <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-4
                        flex-wrap
                        gap-3">

                <div>

                    <h4 class="mb-1 fw-bold">

                        <i class="bi bi-person-workspace"></i>

                        Teachers

                    </h4>

                    <p class="text-muted mb-0">

                        Manage all teaching staff

                    </p>

                </div>


                <a
                    href="teacher-form.html"
                    class="btn btn-gold">

                    <i class="bi bi-plus-lg"></i>

                    Add Teacher

                </a>

            </div>


            <!-- SUMMARY CARDS -->

            <div class="row g-3 mb-4">

                <div class="col-md-4">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-blue">

                                <i class="bi bi-people-fill"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Total Teachers

                                </div>

                                <h4
                                    id="totalTeachers"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-green">

                                <i class="bi bi-book"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Subjects

                                </div>

                                <h4
                                    id="totalSubjects"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="stat-card">

                        <div class="d-flex
                                    align-items-center
                                    gap-3">

                            <div
                                class="stat-icon icon-gold">

                                <i class="bi bi-funnel"></i>

                            </div>

                            <div>

                                <div class="text-muted small">

                                    Showing

                                </div>

                                <h4
                                    id="showingTeachers"
                                    class="mb-0 fw-bold">

                                    0

                                </h4>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- TEACHER LIST -->

            <div class="panel">

                <div class="panel-header">

                    <div>

                        <h5 class="mb-1">

                            <i class="bi bi-list-ul"></i>

                            Teacher List

                        </h5>

                        <small class="text-muted">

                            Search or filter teachers

                        </small>

                    </div>

                </div>


                <div class="panel-body">


                    <!-- FILTERS -->

                    <div class="row g-3 mb-4">

                        <div class="col-md-7">

                            <label
                                class="form-label fw-semibold">

                                Search Teacher

                            </label>

                            <div class="input-group">

                                <span
                                    class="input-group-text">

                                    <i class="bi bi-search"></i>

                                </span>

                                <input
                                    type="text"
                                    id="searchTeacher"
                                    class="form-control"
                                    placeholder="Search by name, subject or phone...">

                            </div>

                        </div>


                        <div class="col-md-3">

                            <label
                                class="form-label fw-semibold">

                                Subject

                            </label>

                            <select
                                id="subjectFilter"
                                class="form-select">

                                <option value="">

                                    All Subjects

                                </option>

                            </select>

                        </div>


                        <div class="col-md-2
                                    d-flex
                                    align-items-end">

                            <button
                                type="button"
                                id="clearFilter"
                                class="btn btn-outline-secondary w-100">

                                <i class="bi bi-x-circle"></i>

                                Clear

                            </button>

                        </div>

                    </div>


                    <!-- TABLE -->

                    <div class="table-responsive">

                        <table
                            class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Teacher</th>

                                    <th>Subject</th>

                                    <th>Phone</th>

                                    <th>Email</th>

                                    <th>Qualification</th>

                                    <th>Joining Date</th>

                                    <th>Actions</th>

                                </tr>

                            </thead>


                            <tbody
                                id="teacherTableBody">

                                <tr>

                                    <td
                                        colspan="8"
                                        class="text-center py-4">

                                        Loading...

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        `;


        setupFilters();

        populateSubjectFilter();

    }


    // ==========================================
    // SUBJECT FILTER
    // ==========================================

    function populateSubjectFilter() {

        const select =
            document.getElementById(
                "subjectFilter"
            );

        if (!select) {
            return;
        }


        const subjects =
            teachers
                .map(teacher =>
                    teacher.subject
                    ?? ""
                )
                .filter(subject =>
                    subject !== ""
                )
                .map(subject =>
                    String(subject)
                );


        const uniqueSubjects =
            [...new Set(subjects)]
            .sort();


        uniqueSubjects.forEach(
            subject => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    subject;

                option.textContent =
                    subject;

                select.appendChild(option);

            }
        );

    }


    // ==========================================
    // FILTER SETUP
    // ==========================================

    function setupFilters() {

        const search =
            document.getElementById(
                "searchTeacher"
            );

        const subjectFilter =
            document.getElementById(
                "subjectFilter"
            );

        const clearButton =
            document.getElementById(
                "clearFilter"
            );


        search.addEventListener(
            "input",
            applyFilters
        );


        subjectFilter.addEventListener(
            "change",
            applyFilters
        );


        clearButton.addEventListener(
            "click",
            function () {

                search.value = "";

                subjectFilter.value = "";

                applyFilters();

            }
        );

    }


    // ==========================================
    // APPLY FILTERS
    // ==========================================

    function applyFilters() {

        const searchValue =
            document.getElementById(
                "searchTeacher"
            )
            .value
            .toLowerCase()
            .trim();


        const subjectValue =
            document.getElementById(
                "subjectFilter"
            ).value;


        filteredTeachers =
            teachers.filter(teacher => {

                const name =
                    String(
                        teacher.teacherName
                        ?? teacher.name
                        ?? ""
                    ).toLowerCase();


                const subject =
                    String(
                        teacher.subject
                        ?? ""
                    ).toLowerCase();


                const phone =
                    String(
                        teacher.phone
                        ?? ""
                    ).toLowerCase();


                const matchesSearch =
                    !searchValue
                    ||
                    name.includes(searchValue)
                    ||
                    subject.includes(searchValue)
                    ||
                    phone.includes(searchValue);


                const matchesSubject =
                    !subjectValue
                    ||
                    String(
                        teacher.subject
                        ?? ""
                    )
                    === subjectValue;


                return (
                    matchesSearch
                    &&
                    matchesSubject
                );

            });


        renderTeachers();

    }


    // ==========================================
    // RENDER TEACHERS
    // ==========================================

    function renderTeachers() {

        const tbody =
            document.getElementById(
                "teacherTableBody"
            );


        if (!tbody) {
            return;
        }


        // TOTAL TEACHERS

        document.getElementById(
            "totalTeachers"
        ).textContent =
            teachers.length;


        // TOTAL SUBJECTS

        const subjects =
            teachers
                .map(teacher =>
                    String(
                        teacher.subject
                        ?? ""
                    )
                )
                .filter(subject =>
                    subject !== ""
                );


        document.getElementById(
            "totalSubjects"
        ).textContent =
            new Set(subjects).size;


        // SHOWING

        document.getElementById(
            "showingTeachers"
        ).textContent =
            filteredTeachers.length;


        // EMPTY

        if (
            filteredTeachers.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="text-center py-5">

                        <i
                            class="bi bi-person-x fs-2
                                   text-muted">
                        </i>

                        <div
                            class="mt-2 text-muted">

                            No teachers found.

                        </div>

                    </td>

                </tr>

            `;

            return;

        }


        // TABLE

        tbody.innerHTML =
            filteredTeachers
            .map(teacher => {

                const id =
                    teacher.teacherId
                    ??
                    teacher.id;


                const name =
                    teacher.teacherName
                    ??
                    teacher.name
                    ??
                    "-";


                const subject =
                    teacher.subject
                    ??
                    "-";


                const phone =
                    teacher.phone
                    ??
                    "-";


                const email =
                    teacher.email
                    ??
                    "-";


                const qualification =
                    teacher.qualification
                    ??
                    "-";


                const joiningDate =
                    teacher.joiningDate
                    ??
                    teacher.joining_date
                    ??
                    "-";


                return `

                    <tr>

                        <td>

                            <strong>
                                ${id}
                            </strong>

                        </td>


                        <td>

                            <strong>
                                ${name}
                            </strong>

                        </td>


                        <td>

                            <span
                                class="badge bg-light
                                       text-dark border">

                                ${subject}

                            </span>

                        </td>


                        <td>

                            ${phone}

                        </td>


                        <td>

                            ${email}

                        </td>


                        <td>

                            ${qualification}

                        </td>


                        <td>

                            ${formatDate(joiningDate)}

                        </td>


                        <td>

                            <div
                                class="d-flex
                                       gap-2
                                       flex-wrap">

                                <a
                                    href="teacher-form.html?id=${id}"
                                    class="btn btn-sm
                                           btn-outline-secondary">

                                    <i class="bi bi-pencil"></i>

                                    Edit

                                </a>


                                <button
                                    type="button"
                                    class="btn btn-sm
                                           btn-outline-danger"
                                    onclick="deleteTeacher(${id})">

                                    <i class="bi bi-trash"></i>

                                    Delete

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            })
            .join("");

    }


    // ==========================================
    // DATE FORMAT
    // ==========================================

    function formatDate(value) {

        if (!value) {
            return "-";
        }


        const date =
            new Date(value);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleDateString(
            "en-GB"
        );

    }


    // ==========================================
    // DELETE TEACHER
    // ==========================================

    async function deleteTeacher(id) {

        const teacher =
            teachers.find(
                teacher =>
                    Number(
                        teacher.teacherId
                        ??
                        teacher.id
                    )
                    === Number(id)
            );


        const teacherName =
            teacher
            ? (
                teacher.teacherName
                ??
                teacher.name
                ??
                "this teacher"
            )
            : "this teacher";


        const confirmed =
            confirm(
                `Are you sure you want to delete ${teacherName}?`
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/teachers/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            alert(
                "Teacher deleted successfully."
            );


            await loadTeachers();

        }

        catch (error) {

            console.error(error);

            alert(
                "Unable to delete teacher."
            );

        }

    }


    // ==========================================
    // START
    // ==========================================

    loadTeachers();

</script>

</body>

</html>
