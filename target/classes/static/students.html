<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students | Genius Academy</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <style>

        /* =====================================================
           STUDENT PAGE
        ====================================================== */

        .students-page {
            width: 100%;
        }


        /* =====================================================
           PAGE TOP
        ====================================================== */

        .student-page-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .student-page-title h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: var(--ga-navy);
        }

        .student-page-title p {
            margin: 5px 0 0;
            color: var(--ga-muted);
            font-size: 13px;
        }


        /* =====================================================
           REFRESH BUTTON
        ====================================================== */

        .refresh-btn {
            border: 1px solid var(--ga-border);
            background: #fff;
            color: var(--ga-navy);
            font-weight: 700;
            border-radius: 9px;
            padding: 9px 14px;
        }

        .refresh-btn:hover {
            background: #f6f8fb;
        }


        /* =====================================================
           STAT CARDS
        ====================================================== */

        .student-stat-card {
            background: #fff;
            border: 1px solid var(--ga-border);
            border-radius: 14px;
            padding: 17px;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .student-stat-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ga-gold-soft);
            color: var(--ga-gold);
            font-size: 19px;
        }

        .student-stat-label {
            font-size: 11px;
            color: var(--ga-muted);
            margin-bottom: 3px;
        }

        .student-stat-value {
            font-size: 21px;
            font-weight: 800;
            color: var(--ga-navy);
        }


        /* =====================================================
           FILTER PANEL
        ====================================================== */

        .student-filter-panel {
            background: #fff;
            border: 1px solid var(--ga-border);
            border-radius: 14px;
            margin-top: 20px;
            padding: 18px;
        }

        .filter-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--ga-navy);
            margin-bottom: 12px;
        }

        .student-filter-panel .form-control,
        .student-filter-panel .form-select {
            min-height: 43px;
            border-color: var(--ga-border);
            font-size: 13px;
            border-radius: 9px;
        }

        .student-filter-panel .form-control:focus,
        .student-filter-panel .form-select:focus {
            border-color: var(--ga-gold);
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.10);
        }


        /* =====================================================
           DESKTOP TABLE
        ====================================================== */

        .student-table-panel {
            background: #fff;
            border: 1px solid var(--ga-border);
            border-radius: 14px;
            margin-top: 20px;
            overflow: hidden;
        }

        .student-table-header {
            padding: 17px 18px;
            border-bottom: 1px solid var(--ga-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-table-header h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            color: var(--ga-navy);
        }

        .student-table-header span {
            font-size: 11px;
            color: var(--ga-muted);
        }

        .students-table {
            margin: 0;
        }

        .students-table thead th {
            background: #f8fafc;
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .3px;
            padding: 13px 14px;
            white-space: nowrap;
            border-bottom: 1px solid var(--ga-border);
        }

        .students-table tbody td {
            padding: 13px 14px;
            font-size: 12px;
            vertical-align: middle;
            border-bottom: 1px solid #edf1f5;
        }

        .students-table tbody tr:last-child td {
            border-bottom: none;
        }

        .students-table tbody tr:hover {
            background: #fbfcfe;
        }


        /* =====================================================
           STUDENT AVATAR
        ====================================================== */

        .student-avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            background: #eaf0f7;
            color: var(--ga-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
        }

        .student-name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-name-main {
            font-weight: 800;
            color: var(--ga-navy);
            font-size: 12px;
        }

        .student-id-small {
            color: var(--ga-muted);
            font-size: 10px;
            margin-top: 2px;
        }


        /* =====================================================
           STATUS
        ====================================================== */

        .student-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
        }

        .student-status.active {
            color: #18794e;
            background: #e8f7ef;
        }

        .student-status.inactive {
            color: #a33a3a;
            background: #fdecec;
        }

        .student-status.other {
            color: #806718;
            background: #fff7da;
        }


        /* =====================================================
           ACTION BUTTONS
        ====================================================== */

        .student-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .student-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: 1px solid var(--ga-border);
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 13px;
        }

        .student-action-btn.view {
            color: #2d7dd2;
        }

        .student-action-btn.card {
            color: #b18a15;
        }

        .student-action-btn.edit {
            color: #198754;
        }

        .student-action-btn.delete {
            color: #d64545;
        }

        .student-action-btn:hover {
            background: #f7f9fc;
        }


        /* =====================================================
           MOBILE STUDENT CARDS
        ====================================================== */

        .mobile-student-list {
            display: none;
        }

        .mobile-student-card {
            background: #fff;
            border: 1px solid var(--ga-border);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .mobile-student-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .mobile-student-name-box {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .mobile-student-name {
            font-size: 14px;
            font-weight: 800;
            color: var(--ga-navy);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mobile-student-id {
            font-size: 10px;
            color: var(--ga-muted);
            margin-top: 3px;
        }

        .mobile-details {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #edf1f5;
        }

        .mobile-detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 34px;
        }

        .mobile-detail-label {
            color: var(--ga-muted);
            font-size: 10px;
        }

        .mobile-detail-value {
            color: var(--ga-navy);
            font-size: 11px;
            font-weight: 700;
            text-align: right;
        }

        .mobile-phone-link {
            color: #2d7dd2;
            text-decoration: none;
            font-weight: 800;
        }

        .mobile-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-top: 13px;
        }

        .mobile-action {
            min-height: 38px;
            border: 1px solid var(--ga-border);
            border-radius: 8px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .mobile-action.view {
            color: #2d7dd2;
        }

        .mobile-action.card {
            color: #b18a15;
        }

        .mobile-action.edit {
            color: #198754;
        }

        .mobile-action.delete {
            color: #d64545;
        }


        /* =====================================================
           EMPTY STATE
        ====================================================== */

        .empty-state {
            padding: 45px 20px;
            text-align: center;
            color: var(--ga-muted);
        }

        .empty-state i {
            font-size: 38px;
            color: #c6d0dc;
            margin-bottom: 10px;
        }

        .empty-state h4 {
            font-size: 15px;
            font-weight: 800;
            color: var(--ga-navy);
        }

        .empty-state p {
            font-size: 12px;
            margin: 0;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .students-loading {
            padding: 40px 20px;
            text-align: center;
            color: var(--ga-muted);
        }

        .students-loading .spinner-border {
            width: 25px;
            height: 25px;
            margin-bottom: 10px;
            color: var(--ga-gold);
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 767.98px) {

            .student-page-top {
                align-items: flex-start;
            }

            .student-page-title h2 {
                font-size: 20px;
            }

            .student-page-title p {
                font-size: 11px;
            }

            .refresh-btn {
                width: 42px;
                height: 42px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .refresh-btn .refresh-text {
                display: none;
            }

            .student-stat-card {
                padding: 13px;
                border-radius: 12px;
            }

            .student-stat-icon {
                width: 39px;
                height: 39px;
                min-width: 39px;
                border-radius: 10px;
                font-size: 16px;
            }

            .student-stat-value {
                font-size: 18px;
            }

            .student-stat-label {
                font-size: 10px;
            }

            .student-filter-panel {
                padding: 14px;
                border-radius: 12px;
            }

            .student-filter-panel .form-control,
            .student-filter-panel .form-select {
                min-height: 45px;
            }

            .student-table-panel {
                background: transparent;
                border: none;
                margin-top: 16px;
                overflow: visible;
            }

            .student-table-header {
                background: #fff;
                border: 1px solid var(--ga-border);
                border-radius: 12px;
                padding: 13px;
                margin-bottom: 12px;
            }

            .desktop-student-table {
                display: none;
            }

            .mobile-student-list {
                display: block;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ====================================================== */

        @media (max-width: 400px) {

            .mobile-student-card {
                padding: 13px;
            }

            .mobile-student-name {
                font-size: 13px;
            }

            .mobile-actions {
                gap: 5px;
            }

            .mobile-action {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<script src="js/app.js"></script>


<script>

    /* =====================================================
       GLOBAL
    ====================================================== */

    let students = [];


    /* =====================================================
       PAGE HTML
    ====================================================== */

    function createStudentsPage() {

        document.getElementById("pageContent").innerHTML = `

            <div class="students-page">


                <!-- PAGE TOP -->

                <div class="student-page-top">

                    <div class="student-page-title">

                        <h2>
                            Student Management
                        </h2>

                        <p>
                            Manage students, profiles and ID cards
                        </p>

                    </div>


                    <button
                        class="refresh-btn"
                        onclick="loadStudents()"
                        title="Refresh"
                    >

                        <i class="bi bi-arrow-clockwise"></i>

                        <span class="refresh-text ms-1">
                            Refresh
                        </span>

                    </button>

                </div>



                <!-- STATISTICS -->

                <div class="row g-3">


                    <!-- TOTAL -->

                    <div class="col-6 col-lg-4">

                        <div class="student-stat-card">

                            <div class="student-stat-icon">

                                <i class="bi bi-people-fill"></i>

                            </div>

                            <div>

                                <div class="student-stat-label">
                                    Total Students
                                </div>

                                <div
                                    class="student-stat-value"
                                    id="totalStudents"
                                >
                                    0
                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- ACTIVE -->

                    <div class="col-6 col-lg-4">

                        <div class="student-stat-card">

                            <div class="student-stat-icon">

                                <i class="bi bi-person-check-fill"></i>

                            </div>

                            <div>

                                <div class="student-stat-label">
                                    Active Students
                                </div>

                                <div
                                    class="student-stat-value"
                                    id="activeStudents"
                                >
                                    0
                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- SHOWING -->

                    <div class="col-12 col-lg-4">

                        <div class="student-stat-card">

                            <div class="student-stat-icon">

                                <i class="bi bi-funnel-fill"></i>

                            </div>

                            <div>

                                <div class="student-stat-label">
                                    Showing
                                </div>

                                <div
                                    class="student-stat-value"
                                    id="showingStudents"
                                >
                                    0
                                </div>

                            </div>

                        </div>

                    </div>


                </div>



                <!-- FILTERS -->

                <div class="student-filter-panel">

                    <div class="filter-title">

                        <i class="bi bi-search me-1"></i>

                        Search & Filter Students

                    </div>


                    <div class="row g-2">


                        <!-- SEARCH -->

                        <div class="col-12 col-md-5">

                            <input
                                type="text"
                                id="studentSearch"
                                class="form-control"
                                placeholder="Search name, phone or parent..."
                                oninput="filterStudents()"
                            >

                        </div>



                        <!-- CLASS -->

                        <div class="col-6 col-md-3">

                            <select
                                id="classFilter"
                                class="form-select"
                                onchange="filterStudents()"
                            >

                                <option value="">
                                    All Classes
                                </option>

                            </select>

                        </div>



                        <!-- STATUS -->

                        <div class="col-6 col-md-2">

                            <select
                                id="statusFilter"
                                class="form-select"
                                onchange="filterStudents()"
                            >

                                <option value="">
                                    All Status
                                </option>

                                <option value="active">
                                    Active
                                </option>

                                <option value="inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>



                        <!-- CLEAR -->

                        <div class="col-12 col-md-2">

                            <button
                                class="btn btn-outline-secondary w-100"
                                style="min-height:43px;border-radius:9px;"
                                onclick="clearFilters()"
                            >

                                <i class="bi bi-x-circle me-1"></i>

                                Clear

                            </button>

                        </div>


                    </div>

                </div>



                <!-- STUDENT LIST -->

                <div class="student-table-panel">


                    <!-- HEADER -->

                    <div class="student-table-header">

                        <h3>

                            <i class="bi bi-mortarboard-fill me-1"></i>

                            Student List

                        </h3>

                        <span id="studentCountText">
                            0 students
                        </span>

                    </div>



                    <!-- DESKTOP TABLE -->

                    <div class="desktop-student-table">

                        <div class="table-responsive">

                            <table
                                class="table students-table"
                            >

                                <thead>

                                    <tr>

                                        <th>
                                            ID
                                        </th>

                                        <th>
                                            Student
                                        </th>

                                        <th>
                                            Class
                                        </th>

                                        <th>
                                            Phone
                                        </th>

                                        <th>
                                            Parent
                                        </th>

                                        <th>
                                            Status
                                        </th>

                                        <th>
                                            Actions
                                        </th>

                                    </tr>

                                </thead>


                                <tbody
                                    id="studentsTableBody"
                                >

                                    <tr>

                                        <td colspan="7">

                                            <div class="students-loading">

                                                <div
                                                    class="spinner-border"
                                                ></div>

                    <div

                        id="mobileStudentList"

                    </div>


                </div>


            </div>

        `;

    }


    /* =====================================================
       LOAD STUDENTS
    ====================================================== */

    async function loadStudents() {

        const tableBody =
            document.getElementById(
                "studentsTableBody"
            );

        const mobileList =
            document.getElementById(
                "mobileStudentList"
            );


        tableBody.innerHTML = `

            <tr>

                <td colspan="7">

                    <div class="students-loading">

                        <div
                            class="spinner-border"
                        ></div>

                        <div>
                            Loading students...
                        </div>

                    </div>

                </td>

            </tr>

        `;


        mobileList.innerHTML = `

            <div class="students-loading">

                <div
                    class="spinner-border"
                ></div>

                <div>
                    Loading students...
                </div>

            </div>

        `;


        try {

            const response =
                await fetch("/api/students");


            if (!response.ok) {

                throw new Error(
                    "Failed to load students"
                );

            }


            students =
                await response.json();


            updateStatistics();

            populateClassFilter();

            filterStudents();


        } catch (error) {

            console.error(
                "Student loading error:",
                error
            );


            tableBody.innerHTML = `

                <tr>

                    <td colspan="7">

                        <div class="empty-state">

                            <i class="bi bi-exclamation-circle"></i>

                            <h4>
                                Unable to load students
                            </h4>

                            <p>
                                Please check your server and try again.
                            </p>

                        </div>

                    </td>

                </tr>

            `;


            mobileList.innerHTML = `

                <div class="empty-state">

                    <i class="bi bi-exclamation-circle"></i>

                    <h4>
                        Unable to load students
                    </h4>

                    <p>
                        Please check your server and try again.
                    </p>

                </div>

            `;

        }

    }


    /* =====================================================
       UPDATE STATISTICS
    ====================================================== */

    function updateStatistics() {

        const total =
            students.length;


        const active =
            students.filter(
                student =>
                    getStatus(student)
                        .toLowerCase() === "active"
            ).length;


        document.getElementById(
            "totalStudents"
        ).textContent = total;


        document.getElementById(
            "activeStudents"
        ).textContent = active;

    }


    /* =====================================================
       CLASS FILTER
    ====================================================== */

    function populateClassFilter() {

        const select =
            document.getElementById(
                "classFilter"
            );


        const currentValue =
            select.value;


        const classes =
            [
                ...new Set(
                    students
                        .map(
                            student =>
                                getClass(student)
                        )
                        .filter(
                            value =>
                                value !== "-"
                        )
                )
            ];


        classes.sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    undefined,
                    {
                        numeric: true
                    }
                )
        );


        select.innerHTML = `

            <option value="">
                All Classes
            </option>

        `;


        classes.forEach(
            className => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    className;

                option.textContent =
                    `Class ${className}`;

                select.appendChild(
                    option
                );

            }
        );


        if (
            classes.includes(currentValue)
        ) {

            select.value =
                currentValue;

        }

    }


    /* =====================================================
       FILTER
    ====================================================== */

    function filterStudents() {

        const search =
            document
                .getElementById(
                    "studentSearch"
                )
                .value
                .trim()
                .toLowerCase();


        const classFilter =
            document
                .getElementById(
                    "classFilter"
                )
                .value
                .trim()
                .toLowerCase();


        const statusFilter =
            document
                .getElementById(
                    "statusFilter"
                )
                .value
                .trim()
                .toLowerCase();


        const filtered =
            students.filter(
                student => {

                    const name =
                        getName(student)
                            .toLowerCase();

                    const phone =
                        getPhone(student)
                            .toLowerCase();

                    const parent =
                        getParent(student)
                            .toLowerCase();

                    const className =
                        getClass(student)
                            .toLowerCase();

                    const status =
                        getStatus(student)
                            .toLowerCase();


                    const matchesSearch =
                        !search ||
                        name.includes(search) ||
                        phone.includes(search) ||
                        parent.includes(search);


                    const matchesClass =
                        !classFilter ||
                        className === classFilter;


                    const matchesStatus =
                        !statusFilter ||
                        status === statusFilter;


                    return (
                        matchesSearch &&
                        matchesClass &&
                        matchesStatus
                    );

                }
            );


        document.getElementById(
            "showingStudents"
        ).textContent =
            filtered.length;


        document.getElementById(
            "studentCountText"
        ).textContent =
            `${filtered.length} ${
                filtered.length === 1
                    ? "student"
                    : "students"
            }`;


        renderDesktopTable(
            filtered
        );


        renderMobileCards(
            filtered
        );

    }


    /* =====================================================
       DESKTOP TABLE
    ====================================================== */

    function renderDesktopTable(
        list
    ) {

        const body =
            document.getElementById(
                "studentsTableBody"
            );


        if (!list.length) {

            body.innerHTML = `

                <tr>

                    <td colspan="7">

                        <div class="empty-state">

                            <i class="bi bi-person-x"></i>

                            <h4>
                                No students found
                            </h4>

                            <p>
                                Try changing your search or filters.
                            </p>

                        </div>

                    </td>

                </tr>

            `;

            return;

        }


        body.innerHTML =
            list.map(
                student =>
                    createDesktopRow(
                        student
                    )
            ).join("");

    }


    /* =====================================================
       DESKTOP ROW
    ====================================================== */

    function createDesktopRow(
        student
    ) {

        const id =
            getId(student);


        const name =
            getName(student);


        const className =
            getClass(student);


        const phone =
            getPhone(student);


        const parent =
            getParent(student);


        const status =
            getStatus(student);


        return `

            <tr>


                <!-- ID -->

                <td>

                    <strong>
                        ${escapeHtml(id)}
                    </strong>

                </td>


                <!-- STUDENT -->

                <td>

                    <div class="student-name-cell">

                        <div class="student-avatar">

                            ${getInitials(name)}

                        </div>

                        <div>

                            <div class="student-name-main">

                                ${escapeHtml(name)}

                            </div>

                            <div class="student-id-small">

                                GA-${String(id).padStart(4, "0")}

                            </div>

                        </div>

                    </div>

                </td>


                <!-- CLASS -->

                <td>

                    <strong>
                        ${escapeHtml(className)}
                    </strong>

                </td>


                <!-- PHONE -->

                <td>

                    ${
                        phone !== "-"
                            ? `
                                <a
                                    href="tel:${escapeHtml(phone)}"
                                    style="text-decoration:none;color:#2d7dd2;font-weight:700;"
                                >
                                    ${escapeHtml(phone)}
                                </a>
                              `
                            : "-"
                    }

                </td>


                <!-- PARENT -->

                <td>

                    ${escapeHtml(parent)}

                </td>


                <!-- STATUS -->

                <td>

                    ${createStatusBadge(status)}

                </td>


                <!-- ACTIONS -->

                <td>

                    ${createDesktopActions(id)}

                </td>


            </tr>

        `;

    }


    /* =====================================================
       DESKTOP ACTIONS
    ====================================================== */

    function createDesktopActions(
        id
    ) {

        return `

            <div class="student-actions">


                <a
                    href="student-details.html?id=${encodeURIComponent(id)}"
                    class="student-action-btn view"
                    title="View Student"
                >

                    <i class="bi bi-eye"></i>

                </a>


                <a
                    href="student-id-card.html?id=${encodeURIComponent(id)}"
                    class="student-action-btn card"
                    title="Student ID Card"
                >

                    <i class="bi bi-person-vcard"></i>

                </a>


                <a
                    href="student-form.html?id=${encodeURIComponent(id)}"
                    class="student-action-btn edit"
                    title="Edit Student"
                >

                    <i class="bi bi-pencil"></i>

                </a>


                <button
                    type="button"
                    class="student-action-btn delete"
                    title="Delete Student"
                    onclick="deleteStudent(${Number(id)})"
                >

                    <i class="bi bi-trash"></i>

                </button>


            </div>

        `;

    }


    /* =====================================================
       MOBILE CARDS
    ====================================================== */

    function renderMobileCards(
        list
    ) {

        const container =
            document.getElementById(
                "mobileStudentList"
            );


        if (!list.length) {

            container.innerHTML = `

                <div class="empty-state">

                    <i class="bi bi-person-x"></i>

                    <h4>
                        No students found
                    </h4>

                    <p>
                        Try changing your search or filters.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            list.map(
                student =>
                    createMobileCard(
                        student
                    )
            ).join("");

    }


    /* =====================================================
       MOBILE CARD
    ====================================================== */

    function createMobileCard(
        student
    ) {

        const id =
            getId(student);


        const name =
            getName(student);


        const className =
            getClass(student);


        const phone =
            getPhone(student);


        const parent =
            getParent(student);


        const status =
            getStatus(student);


        return `

            <div class="mobile-student-card">


                <!-- TOP -->

                <div class="mobile-student-top">


                    <div class="mobile-student-name-box">


                        <div class="student-avatar">

                            ${getInitials(name)}

                        </div>


                        <div style="min-width:0;">

                            <div class="mobile-student-name">

                                ${escapeHtml(name)}

                            </div>


                            <div class="mobile-student-id">

                                Student ID:
                                GA-${String(id).padStart(4, "0")}

                            </div>

                        </div>


                    </div>


                    <div>

                        ${createStatusBadge(status)}

                    </div>


                </div>



                <!-- DETAILS -->

                <div class="mobile-details">


                    <div class="mobile-detail-row">

                        <span class="mobile-detail-label">

                            <i class="bi bi-mortarboard me-1"></i>
                            Class

                        </span>

                        <span class="mobile-detail-value">

                            ${escapeHtml(className)}

                        </span>

                    </div>


                    <div class="mobile-detail-row">

                        <span class="mobile-detail-label">

                            <i class="bi bi-telephone me-1"></i>
                            Phone

                        </span>

                        <span class="mobile-detail-value">

                            ${
                                phone !== "-"
                                    ? `
                                        <a
                                            href="tel:${escapeHtml(phone)}"
                                            class="mobile-phone-link"
                                        >
                                            ${escapeHtml(phone)}
                                        </a>
                                      `
                                    : "-"
                            }

                        </span>

                    </div>


                    <div class="mobile-detail-row">

                        <span class="mobile-detail-label">

                            <i class="bi bi-person me-1"></i>
                            Parent

                        </span>

                        <span class="mobile-detail-value">

                            ${escapeHtml(parent)}

                        </span>

                    </div>


                </div>



                <!-- ACTIONS -->

                <div class="mobile-actions">


                    <a
                        href="student-details.html?id=${encodeURIComponent(id)}"
                        class="mobile-action view"
                    >

                        <i class="bi bi-eye me-1"></i>
                        View

                    </a>


                    <a
                        href="student-id-card.html?id=${encodeURIComponent(id)}"
                        class="mobile-action card"
                    >

                        <i class="bi bi-person-vcard me-1"></i>
                        ID Card

                    </a>


                    <a
                        href="student-form.html?id=${encodeURIComponent(id)}"
                        class="mobile-action edit"
                    >

                        <i class="bi bi-pencil me-1"></i>
                        Edit

                    </a>


                    <button
                        type="button"
                        class="mobile-action delete"
                        onclick="deleteStudent(${Number(id)})"
                    >

                        <i class="bi bi-trash me-1"></i>
                        Delete

                    </button>


                </div>


            </div>

        `;

    }


    /* =====================================================
       STATUS BADGE
    ====================================================== */

    function createStatusBadge(
        status
    ) {

        const value =
            status || "Active";


        const lower =
            String(value).toLowerCase();


        let className =
            "other";


        if (lower === "active") {

            className =
                "active";

        } else if (
            lower === "inactive"
        ) {

            className =
                "inactive";

        }


        return `

            <span class="student-status ${className}">

                <i class="bi bi-circle-fill" style="font-size:5px;"></i>

                ${escapeHtml(value)}

            </span>

        `;

    }


    /* =====================================================
       GETTERS
    ====================================================== */

    function getId(student) {

        return (
            student.id ??
            student.studentId ??
            student.student_id ??
            "-"
        );

    }


    function getName(student) {

        return (
            student.name ??
            student.studentName ??
            student.student_name ??
            "Unknown Student"
        );

    }


    function getClass(student) {

        return String(
            student.className ??
            student.standard ??
            student.class ??
            student.class_name ??
            "-"
        );

    }


    function getPhone(student) {

        return String(
            student.phone ??
            student.studentPhone ??
            student.mobile ??
            "-"
        );

    }


    function getParent(student) {

        return String(
            student.parentName ??
            student.parent_name ??
            student.guardianName ??
            student.guardian_name ??
            "-"
        );

    }


    function getStatus(student) {

        return String(
            student.status ??
            "Active"
        );

    }


    /* =====================================================
       INITIALS
    ====================================================== */

    function getInitials(
        name
    ) {

        if (
            !name ||
            name === "-"
        ) {

            return "ST";

        }


        const words =
            String(name)
                .trim()
                .split(/\s+/);


        if (words.length === 1) {

            return words[0]
                .substring(0, 2)
                .toUpperCase();

        }


        return (
            words[0][0] +
            words[words.length - 1][0]
        ).toUpperCase();

    }


    /* =====================================================
       CLEAR FILTERS
    ====================================================== */

    function clearFilters() {

        document.getElementById(
            "studentSearch"
        ).value = "";


        document.getElementById(
            "classFilter"
        ).value = "";


        document.getElementById(
            "statusFilter"
        ).value = "";


        filterStudents();

    }


    /* =====================================================
       DELETE STUDENT
    ====================================================== */

    async function deleteStudent(
        id
    ) {

        const student =
            students.find(
                item =>
                    Number(getId(item)) === Number(id)
            );


        const studentName =
            student
                ? getName(student)
                : "this student";


        const confirmed =
            confirm(
                `Are you sure you want to delete "${studentName}"?\n\nThis action cannot be undone.`
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/students/${encodeURIComponent(id)}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            alert(
                "Student deleted successfully."
            );


            await loadStudents();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            alert(
                "Unable to delete student. Please try again."
            );

        }

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "-";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       INITIALIZE PAGE
    ====================================================== */

    renderLayout(
        "students",
        "Student Management"
    );


    createStudentsPage();


    loadStudents();

</script>


</body>

</html>
