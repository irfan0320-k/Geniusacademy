
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bulk Attendance | Genius Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 900px">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-1">Genius Academy</h3>
            <div>Bulk Attendance</div>
        </div>

        <div class="card-body">
            <div id="message"></div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="attendanceDate" class="form-label">Attendance Date</label>
                    <input type="date" id="attendanceDate" class="form-control" required>
                </div>
                <div class="col-md-6 d-flex align-items-end gap-2">
                    <button type="button" class="btn btn-outline-success" id="allPresent">
                        Mark All Present
                    </button>
                    <button type="button" class="btn btn-outline-danger" id="allAbsent">
                        Mark All Absent
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Student</th>
                        <th style="min-width: 160px">Status</th>
                    </tr>
                    </thead>
                    <tbody id="studentRows">
                    <tr><td colspan="2" class="text-center">Loading students...</td></tr>
                    </tbody>
                </table>
            </div>

            <button type="button" id="saveButton" class="btn btn-primary">
                Save Class Attendance
            </button>
            <a href="attendance.html" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>

<script>
const dateInput = document.getElementById("attendanceDate");
const rows = document.getElementById("studentRows");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");

function localDate() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

dateInput.value = localDate();

function showMessage(text, type) {
    message.replaceChildren();
    const div = document.createElement("div");
    div.className = `alert alert-${type}`;
    div.textContent = text;
    message.appendChild(div);
}

async function loadStudents() {
    try {
        const response = await fetch("/api/students");
        if (!response.ok) throw new Error("Could not load students.");

        const students = await response.json();
        rows.replaceChildren();

        if (!students.length) {
            rows.innerHTML = '<tr><td colspan="2">No students found.</td></tr>';
            return;
        }

        students.forEach(student => {
            const id = student.id ?? student.studentId;
            const name = student.name ?? student.studentName ?? "Unknown Student";
            const className = student.className ?? student.standard ?? "";

            const tr = document.createElement("tr");
            const nameCell = document.createElement("td");
            const selectCell = document.createElement("td");
            const select = document.createElement("select");

            nameCell.textContent = className
                ? `${name} — Class ${className}`
                : name;

            select.className = "form-select attendance-status";
            select.dataset.studentId = id;

            ["Present", "Absent", "Late"].forEach(status => {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                select.appendChild(option);
            });

            selectCell.appendChild(select);
            tr.append(nameCell, selectCell);
            rows.appendChild(tr);
        });
    } catch (error) {
        console.error(error);
        showMessage(error.message, "danger");
        rows.innerHTML = '<tr><td colspan="2">Unable to load students.</td></tr>';
    }
}

function setAll(status) {
    document.querySelectorAll(".attendance-status").forEach(select => {
        select.value = status;
    });
}

document.getElementById("allPresent").addEventListener("click", () => setAll("Present"));
document.getElementById("allAbsent").addEventListener("click", () => setAll("Absent"));

saveButton.addEventListener("click", async () => {
    message.replaceChildren();

    if (!dateInput.value) {
        showMessage("Please select an attendance date.", "warning");
        return;
    }

    const selects = [...document.querySelectorAll(".attendance-status")];

    if (!selects.length) {
        showMessage("No students available to mark.", "warning");
        return;
    }

    const attendance = selects.map(select => ({
        studentId: Number(select.dataset.studentId),
        status: select.value
    }));

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
        const response = await fetch("/api/attendance/bulk", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                date: dateInput.value,
                attendance
            })
        });

        const result = await response.json();

        if (!response.ok || result.success !== true) {
            throw new Error(result.message || "Unable to save attendance.");
        }

        showMessage(
            `Done! Saved: ${result.inserted}. Already marked/skipped: ${result.skipped}.`,
            "success"
        );
    } catch (error) {
        console.error(error);
        showMessage(error.message || "Bulk attendance failed.", "danger");
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Class Attendance";
    }
});

loadStudents();
</script>
</body>
</html>
