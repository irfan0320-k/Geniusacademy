<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Form | Genius Academy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<script src="js/app.js"></script>

<script>

    // ==========================================
    // GET TEACHER ID
    // ==========================================

    const id = queryParam("id");

    renderLayout(
        "teachers",
        id ? "Edit Teacher" : "Add Teacher"
    );


    // ==========================================
    // LOAD TEACHER FORM
    // ==========================================

    async function loadTeacherForm() {

        let teacher = {
            name: "",
            subject: "",
            phone: "",
            email: "",
            qualification: "",
            joiningDate: ""
        };


        // ======================================
        // EDIT MODE
        // ======================================

        if (id) {

            try {

                const response = await fetch(`/api/teachers/${id}`);

                if (!response.ok) {
                    throw new Error("Teacher not found");
                }

                const data = await response.json();

                teacher = {
                    name: data.name || "",
                    subject: data.subject || "",
                    phone: data.phone || "",
                    email: data.email || "",
                    qualification: data.qualification || "",
                    joiningDate: data.joiningDate
                        ? data.joiningDate.substring(0, 10)
                        : ""
                };

            } catch (error) {

                console.error(error);

                alert("Unable to load teacher details.");

                // IMPORTANT:
                // Correct file name is teachers.html
                window.location.href = "teachers.html";

                return;
            }

        } else {

            // ==================================
            // ADD MODE
            // ==================================

            teacher.joiningDate = today();

        }


        // ==========================================
        // FORM HTML
        // ==========================================

        document.getElementById("pageContent").innerHTML = `

            <div class="panel">

                <div class="panel-header">

                    <h5 class="mb-0">

                        <i class="bi bi-person-workspace"></i>

                        ${id ? "Edit Teacher" : "Add New Teacher"}

                    </h5>

                </div>


                <div class="panel-body">

                    <form id="teacherForm" class="row g-3">


                        <!-- TEACHER NAME -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Teacher Name
                            </label>

                            <input
                                class="form-control"
                                type="text"
                                name="name"
                                value="${teacher.name}"
                                placeholder="Enter teacher name"
                                required
                            >

                        </div>


                        <!-- SUBJECT -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                class="form-control"
                                type="text"
                                name="subject"
                                value="${teacher.subject}"
                                placeholder="e.g. Mathematics"
                                required
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                class="form-control"
                                type="tel"
                                name="phone"
                                value="${teacher.phone}"
                                placeholder="Enter phone number"
                                maxlength="15"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                class="form-control"
                                type="email"
                                name="email"
                                value="${teacher.email}"
                                placeholder="Enter email address"
                            >

                        </div>


                        <!-- QUALIFICATION -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Qualification
                            </label>

                            <input
                                class="form-control"
                                type="text"
                                name="qualification"
                                value="${teacher.qualification}"
                                placeholder="e.g. M.Sc, B.Ed"
                                required
                            >

                        </div>


                        <!-- JOINING DATE -->

                        <div class="col-md-6">

                            <label class="form-label">
                                Joining Date
                            </label>

                            <input
                                class="form-control"
                                type="date"
                                name="joiningDate"
                                value="${teacher.joiningDate}"
                                required
                            >

                        </div>


                        <!-- BUTTONS -->

                        <div class="col-12 d-flex gap-2 mt-3">

                            <button
                                class="btn btn-gold"
                                type="submit"
                                id="saveButton"
                            >

                                <i class="bi bi-check-lg"></i>

                                ${id ? "Update Teacher" : "Save Teacher"}

                            </button>


                            <!-- CORRECT FILE NAME -->

                            <a
                                class="btn btn-outline-secondary"
                                href="teachers.html"
                            >

                                <i class="bi bi-x-lg"></i>

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        `;


        // ==========================================
        // FORM SUBMIT
        // ==========================================

        document
            .getElementById("teacherForm")
            .addEventListener("submit", saveTeacher);

    }


    // ==========================================
    // SAVE / UPDATE TEACHER
    // ==========================================

    async function saveTeacher(event) {

        event.preventDefault();


        const form = new FormData(event.target);


        const teacher = {

            name: form.get("name").trim(),

            subject: form.get("subject").trim(),

            phone: form.get("phone").trim(),

            email: form.get("email").trim(),

            qualification: form.get("qualification").trim(),

            joiningDate: form.get("joiningDate")

        };


        const saveButton =
            document.getElementById("saveButton");


        // Disable button while saving

        saveButton.disabled = true;

        saveButton.innerHTML = `
            <span class="spinner-border spinner-border-sm"></span>
            Saving...
        `;


        try {

            let response;


            // ==================================
            // UPDATE EXISTING TEACHER
            // ==================================

            if (id) {

                response = await fetch(`/api/teachers/${id}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(teacher)

                });

            }


            // ==================================
            // ADD NEW TEACHER
            // ==================================

            else {

                response = await fetch("/api/teachers", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(teacher)

                });

            }


            // ==================================
            // CHECK SERVER RESPONSE
            // ==================================

            const result = await response.json();


            // ==================================
            // SUCCESS
            // ==================================

            if (result.success) {

                alert(
                    id
                        ? "Teacher updated successfully!"
                        : "Teacher added successfully!"
                );


                // IMPORTANT:
                // Correct file name is teachers.html

                window.location.href = "teachers.html";

            }


            // ==================================
            // SERVER ERROR
            // ==================================

            else {

                alert(
                    "Error: " +
                    (result.message || "Unable to save teacher.")
                );


                saveButton.disabled = false;

                saveButton.innerHTML = `
                    <i class="bi bi-check-lg"></i>
                    ${id ? "Update Teacher" : "Save Teacher"}
                `;

            }

        }


        // ==================================
        // CONNECTION / SERVER ERROR
        // ==================================

        catch (error) {

            console.error(error);

            alert(
                "Server error. Please make sure Spring Boot is running."
            );


            saveButton.disabled = false;

            saveButton.innerHTML = `
                <i class="bi bi-check-lg"></i>
                ${id ? "Update Teacher" : "Save Teacher"}
            `;

        }

    }


    // ==========================================
    // START
    // ==========================================

    loadTeacherForm();

</script>

</body>

</html>
