/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(amount) {

    return "₹" +
        Number(amount || 0).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   GET STUDENT ID
===================================================== */

function getStudentId(record) {

    return (
        record.studentId ??
        record.student_id ??
        record.studentID ??
        record.studentIdNumber ??
        null
    );
}


/* =====================================================
   FIND STUDENT NAME
===================================================== */

function findStudentName(studentId) {

    if (studentId === null || studentId === undefined) {
        return "Unknown Student";
    }


    const student = studentsData.find(
        s => Number(
            s.id ??
            s.studentId ??
            s.student_id
        ) === Number(studentId)
    );


    if (!student) {
        return "Unknown Student";
    }


    return (
        student.name ??
        student.studentName ??
        student.student_name ??
        "Unknown Student"
    );
}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

    try {

        const responses =
            await Promise.all([

                fetch("/api/dashboard"),

                fetch("/api/students"),

                fetch("/api/teachers"),

                fetch("/api/fees"),

                fetch("/api/performance")

            ]);


        const [
            dashboardResponse,
            studentsResponse,
            teachersResponse,
            feesResponse,
            performanceResponse
        ] = responses;


        /* ===============================
           DASHBOARD
        =============================== */

        dashboardData =
            dashboardResponse.ok
                ? await dashboardResponse.json()
                : {};


        /* ===============================
           STUDENTS
        =============================== */

        studentsData =
            studentsResponse.ok
                ? await studentsResponse.json()
                : [];


        /* ===============================
           TEACHERS
        =============================== */

        teachersData =
            teachersResponse.ok
                ? await teachersResponse.json()
                : [];


        /* ===============================
           FEES
        =============================== */

        feesData =
            feesResponse.ok
                ? await feesResponse.json()
                : [];


        /* ===============================
           PERFORMANCE
        =============================== */

        performanceData =
            performanceResponse.ok
                ? await performanceResponse.json()
                : [];


        console.log(
            "Students:",
            studentsData
        );

        console.log(
            "Performance:",
            performanceData
        );


        /* ===============================
           STAT CARDS
        =============================== */

        document.getElementById(
            "totalStudents"
        ).textContent =
            dashboardData.totalStudents ??
            studentsData.length;


        document.getElementById(
            "totalTeachers"
        ).textContent =
            dashboardData.totalTeachers ??
            teachersData.length;


        document.getElementById(
            "collectedFees"
        ).textContent =
            formatMoney(
                dashboardData.collectedFees ??
                dashboardData.totalFees ??
                0
            );


        document.getElementById(
            "pendingFees"
        ).textContent =
            formatMoney(
                dashboardData.pendingFees ?? 0
            );


        document.getElementById(
            "presentToday"
        ).textContent =
            dashboardData.presentToday ??
            0;


        document.getElementById(
            "performanceRecords"
        ).textContent =
            dashboardData.totalPerformance ??
            performanceData.length;


        /* ===============================
           TABLES
        =============================== */

        renderRecentStudents();

        renderRecentPerformance();


        /* ===============================
           CHARTS
        =============================== */

        createFeesChart();

        createAcademyChart();


    } catch (error) {

        console.error(
            "Dashboard loading error:",
            error
        );

    }

}


/* =====================================================

===================================================== */

function renderRecentStudents() {

    const body =
        document.getElementById(
            "recentStudentsBody"
        );


    if (!body) return;


    if (!studentsData.length) {

        body.innerHTML = `
            <tr>
                <td colspan="4"
                    class="text-center text-muted py-4">
                    No students found
                </td>
            </tr>
        `;

        return;
    }


    const recent =
        [...studentsData]
            .reverse()
            .slice(0, 5);


    body.innerHTML =
        recent.map(student => {

            const id =
                student.id ??
                student.studentId ??
                student.student_id ??
                "-";


            const name =
                student.name ??
                student.studentName ??
                student.student_name ??
                "-";


            const className =
                student.className ??
                student.standard ??
                student.class ??
                "-";


            const phone =
                student.phone ??
                "-";


            return `

                <tr>

                    <td>
                        ${escapeHtml(id)}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(name)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(
                            String(className)
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            String(phone)
                        )}
                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================================
   RECENT PERFORMANCE
===================================================== */

function renderRecentPerformance() {

    const body =
        document.getElementById(
            "recentPerformanceBody"
        );


    if (!body) return;


    if (!performanceData.length) {

        body.innerHTML = `
            <tr>
                <td colspan="4"
                    class="text-center text-muted py-4">
                    No performance records found
                </td>
            </tr>
        `;

        return;
    }


    const recent =
        [...performanceData]
            .reverse()
            .slice(0, 5);


    body.innerHTML =
        recent.map(record => {


            /*
             * IMPORTANT:
             * Don't use performance ID as student ID.
             */

            const studentId =
                getStudentId(record);


            /*
             * First try name from API.
             */

            let studentName =
                record.student ??
                record.studentName ??
                record.student_name;


            /*
             * If API returned Unknown Student,
             * find name from /api/students.
             */

            if (
                !studentName ||
                studentName === "Unknown Student"
            ) {

                studentName =
                    findStudentName(studentId);

            }


            const subject =
                record.subject ??
                "-";


            const exam =
                record.examName ??
                record.exam ??
                record.exam_name ??
                "-";


            const marks =
                Number(
                    record.marks ?? 0
                );


            return `

                <tr>

                    <td>

                        <strong>
                            ${escapeHtml(
                                studentName
                            )}
                        </strong>

                    </td>

                    <td>
                        ${escapeHtml(
                            String(subject)
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            String(exam)
                        )}
                    </td>

                    <td>

                        <span class="badge ${
                            marks >= 40
                                ? "bg-primary"
                                : "bg-danger"
                        }">

                            ${marks}

                        </span>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =====================================================

===================================================== */

function createFeesChart() {

    const canvas =
        document.getElementById(
            "feesChart"
        );


    if (!canvas) return;


    if (feesChart) {
        feesChart.destroy();
    }


    const collected =
        Number(
            dashboardData.collectedFees ??
            dashboardData.totalFees ??
            0
        );


    const pending =
        Number(
            dashboardData.pendingFees ??
            0
        );


    feesChart =
        new Chart(canvas, {

            type: "doughnut",

            data: {

                labels: [
                    "Collected",
                    "Pending"
                ],

                datasets: [{

                    data: [
                        collected,
                        pending
                    ],

                    borderWidth: 2

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {
                        position: "bottom"
                    }

                }

            }

        });

}


/* =====================================================
   ACADEMY CHART
===================================================== */

function createAcademyChart() {

                    label: "Total",

                        studentsData.length,

                        teachersData.length

                    ],

                    borderWidth: 1

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {
                        display: false
                    }

                },

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {
                            precision: 0
                        }

                    }

                }

            }

        });

}
