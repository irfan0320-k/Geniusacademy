
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fee | Genius Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5" style="max-width: 700px;">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="mb-4">💰 Add Fee Payment</h3>

                <div id="message" class="alert d-none"></div>

                <form id="feeForm">
                    <div class="mb-3">
                        <label for="studentId" class="form-label">Student</label>
                        <select id="studentId" class="form-select" required>
                            <option value="">Loading students...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₹)</label>
                        <input id="amount" type="number" class="form-control"
                               min="0.01" step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label for="paymentDate" class="form-label">Payment Date</label>
                        <input id="paymentDate" type="date" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label">Payment Status</label>
                        <select id="status" class="form-select" required>
                            <option value="Paid">Paid</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <button id="saveButton" type="submit" class="btn btn-primary">
                        Save Fee
                    </button>
                    <a href="fees.html" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        const studentSelect = document.getElementById("studentId");
        const message = document.getElementById("message");
        const saveButton = document.getElementById("saveButton");

        document.getElementById("paymentDate").value =
            new Date().toLocaleDateString("en-CA");

        async function loadStudents() {
            try {
                const response = await fetch("/api/students");
                if (!response.ok) throw new Error("Could not load students.");

                const students = await response.json();
                studentSelect.innerHTML = '<option value="">Select student</option>';

                students.forEach(student => {
                    const id = student.id ?? student.studentId;
                    const name = student.name ?? student.studentName ?? "Unknown Student";

                    const option = document.createElement("option");
                    option.value = id;
                    option.textContent = name;
                    studentSelect.appendChild(option);
                });

                if (students.length === 0) {
                    studentSelect.innerHTML = '<option value="">No students found</option>';
                }
            } catch (error) {
                studentSelect.innerHTML = '<option value="">Failed to load students</option>';
                showMessage(error.message, "danger");
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert alert-" + type;
        }

        document.getElementById("feeForm").addEventListener("submit", async event => {
            event.preventDefault();
            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {
                const fee = {
                    studentId: Number(studentSelect.value),
                    amount: Number(document.getElementById("amount").value),
                    paymentDate: document.getElementById("paymentDate").value,
                    status: document.getElementById("status").value
                };

                const response = await fetch("/api/fees", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(fee)
                });

                const result = await response.json();

                if (!response.ok || result.success !== true) {
                    throw new Error(result.message || "Unable to save fee.");
                }

                showMessage("Fee saved successfully!", "success");
                document.getElementById("feeForm").reset();
                document.getElementById("paymentDate").value =
                    new Date().toLocaleDateString("en-CA");
            } catch (error) {
                showMessage(error.message, "danger");
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save Fee";
            }
        });

        loadStudents();
    </script>
</body>
</html>
