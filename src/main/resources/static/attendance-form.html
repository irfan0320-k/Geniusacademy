```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Genius Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:600px">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Genius Academy — Attendance</h3>
        </div>
        <div class="card-body">
            <div id="message"></div>
            <form id="attendanceForm">
                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="number" id="studentId" class="form-control" required min="1">
                </div>
                <div class="mb-3">
                    <label class="form-label">Attendance Date</label>
                    <input type="date" id="attendanceDate" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select" required>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">Save Attendance</button>
                <a href="/attendance.html" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
<script>
document.getElementById("attendanceDate").value =
    new Date().toLocaleDateString("en-CA");

document.getElementById("attendanceForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const message = document.getElementById("message");
    const data = {
        studentId: Number(document.getElementById("studentId").value),
        attendanceDate: document.getElementById("attendanceDate").value,
        status: document.getElementById("status").value
    };

    try {
        const response = await fetch("/api/attendance", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.text();
        if (!response.ok) throw new Error(result || "Request failed");

        message.innerHTML = '<div class="alert alert-success">Attendance saved successfully!</div>';
        this.reset();
        document.getElementById("attendanceDate").value =
            new Date().toLocaleDateString("en-CA");
    } catch (error) {
        message.innerHTML = '<div class="alert alert-danger">Could not save attendance. Check API fields and server logs.</div>';
        console.error(error);
    }
});
</script>
</body>
</html>
